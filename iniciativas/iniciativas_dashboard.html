<html lang="es">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciativas HotelDO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F9F3E6;--panel:#FFFFFF;--panel2:#F5F7FA;--line:#E8ECF0;
  --txt:#0F1834;--txt2:#334155;--mut:#64748B;
  --navy:#223260;--navyd:#0F1834;
  --orange:#ED8B08;--oranged:#D07D06;--orangesoft:rgba(237,139,8,.12);
  --green:#10B981;--greensoft:rgba(16,185,129,.12);
  --red:#EF4444;--redsoft:rgba(239,68,68,.10);
  --blue:#3B82F6;--purple:#8B5CF6;--cyan:#06B6D4;--amber:#F59E0B;
  --sh:0 1px 2px rgba(15,24,52,.04),0 4px 20px rgba(15,24,52,.06);
  --shmd:0 2px 8px rgba(15,24,52,.07),0 8px 32px rgba(15,24,52,.09);
  --shpop:0 8px 40px rgba(15,24,52,.18);
  --r:14px;--r2:10px;--ink:#223260;--we:#FBFAF7;--hov:#FFFBF2;--hov2:#FFF8EC;
}
*{box-sizing:border-box}
html{zoom:.85}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 'Rubik',system-ui,sans-serif}

/* header */
.hdr{position:sticky;top:0;z-index:100;height:56px;background:linear-gradient(100deg,#0F1834 0%,#223260 60%,#2d4080 100%);border-bottom:3px solid var(--orange);display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:var(--shmd)}
.hdr-l{display:flex;align-items:center;gap:18px}
.hdr-title{color:#fff;font-weight:700;font-size:16px;line-height:1.15;border-left:1px solid rgba(255,255,255,.25);padding-left:18px;letter-spacing:.01em}
.hdr-title small{display:block;font-weight:500;font-size:11px;color:#F7B955;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.chips{display:flex;gap:8px}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:5px 14px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.live::first-letter{color:var(--green)}

/* tabs */
.tabs{position:sticky;top:59px;z-index:90;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 28px}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:12px 18px;font:600 13px 'Rubik',sans-serif;color:var(--mut);cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--orange)}

/* filter bar */
.fbar{position:sticky;top:101px;z-index:80;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:7px 28px}
.fl{display:flex;flex-direction:column;gap:3px}
.fl>label{font-size:10px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.fl input[type=text],.fl input[type=date]{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:6px 10px;font:500 13px 'Rubik',sans-serif;color:var(--txt);background:var(--panel);height:30px}
.fl input[type=text]{width:180px}
.ms-wrap{position:relative}
.ms-trigger{min-width:130px;height:30px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 28px 0 10px;font:500 13px 'Rubik',sans-serif;color:var(--txt);cursor:pointer;position:relative}
.ms-trigger::after{content:"▾";position:absolute;right:10px;color:var(--mut)}
.ms-wrap.open .ms-trigger,.ms-trigger:hover{border-color:var(--orange)}
.ms-panel{display:none;position:absolute;top:38px;left:0;z-index:200;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shpop);padding:8px}
.ms-wrap.open .ms-panel{display:block}
.ms-search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:13px 'Rubik',sans-serif}
.ms-actions{display:flex;justify-content:space-between;margin:6px 2px}
.ms-actions button{background:none;border:none;color:var(--orange);font:600 12px 'Rubik',sans-serif;cursor:pointer}
.ms-list{max-height:220px;overflow:auto}
.ms-item{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px}
.ms-item:hover{background:var(--panel2)}
.ms-item input{accent-color:var(--orange)}
.swt{display:flex;align-items:center;gap:7px;height:30px;cursor:pointer;user-select:none;font:600 12px 'Rubik',sans-serif;color:var(--ink);white-space:nowrap}
.swt input{display:none}
.swt-s{width:34px;height:18px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:none}
.swt-s:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.swt input:checked+.swt-s{background:var(--green)}
.swt input:checked+.swt-s:after{left:18px}
.btn-clear{background:linear-gradient(135deg,#F5A02A,var(--orange));box-shadow:0 2px 6px rgba(237,139,8,.35);color:#fff;border:none;border-radius:10px;padding:0 12px;height:30px;font:700 12px 'Rubik',sans-serif;white-space:nowrap;cursor:pointer}
.btn-clear:hover{background:var(--oranged)}
.fcount{margin-left:auto;color:var(--mut);font-size:12px;align-self:center}

/* content */
.wrap{padding:14px 28px 40px;max-width:none;margin:0}
.page{display:none}.page.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:10px 14px;border-top:3px solid var(--navy);transition:.15s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shmd)}
.kpi-g{border-top-color:var(--green)}.kpi-r{border-top-color:var(--red)}.kpi-b{border-top-color:var(--blue)}
.kpi-p{border-top-color:var(--purple)}.kpi-c{border-top-color:var(--cyan)}.kpi-a{border-top-color:var(--amber)}
.kpi-0{border-top:3px solid transparent;border-image:linear-gradient(90deg,var(--navy),var(--orange)) 1}
.kpi-icon{font-size:14px;display:inline-block;margin-right:4px}
.kpi-lbl{display:inline;font-size:10px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.kpi-val{font-size:19px;font-weight:800;color:var(--ink)}
.kpi-sub{font-size:12px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.delta{border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700}
.delta.up{background:var(--greensoft);color:#0b8f66}.delta.dn{background:var(--redsoft);color:var(--red)}.delta.nd{background:var(--panel2);color:var(--mut)}

.ins-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:12px}
.ins-card{display:flex;gap:8px;background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:8px 12px;border-left:4px solid var(--mut);font-size:12px;color:var(--txt2)}
.ins-card.pos{border-left-color:var(--green);background:linear-gradient(90deg,var(--greensoft),var(--panel) 40%)}
.ins-card.neg{border-left-color:var(--red);background:linear-gradient(90deg,var(--redsoft),var(--panel) 40%)}
.ins-card.warn{border-left-color:var(--orange);background:linear-gradient(90deg,var(--orangesoft),var(--panel) 40%)}
.ins-emoji{font-size:16px}
.ins-text b{color:var(--ink)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:10px}
.row2 .card{margin-bottom:0}
.card-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
.card-title{font-size:14px;font-weight:700;color:var(--ink)}
.card-sub{font-size:12px;color:var(--mut)}
.gran{display:flex;background:var(--panel2);border-radius:8px;padding:2px}
.gran button{border:none;background:none;border-radius:6px;padding:4px 10px;font:600 12px 'Rubik',sans-serif;color:var(--mut);cursor:pointer}
.gran button.active{background:var(--orange);color:#fff}
.ch{height:180px;position:relative}

.month{margin:22px 0 8px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.item{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-left:4px solid var(--navy);transition:.15s}
.item:hover{box-shadow:var(--shmd);transform:translateY(-2px)}
.item.fl-warn{border-left-color:var(--orange)}
.item h3{margin:0;font-size:13px;font-weight:700;color:var(--ink);line-height:1.3}
.item .date{color:var(--mut);font-size:12px}
.item p{margin:0;color:var(--txt2);font-size:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(34,50,96,.08);color:var(--ink);font-weight:600}
.tag.cat{background:var(--orangesoft);color:var(--oranged)}
.tag.new{background:var(--greensoft);color:#0b8f66}
.tag.warn{background:var(--redsoft);color:var(--red)}
.empty{padding:40px;text-align:center;color:var(--mut);background:var(--panel);border-radius:var(--r)}

.stbl{width:100%;border-collapse:collapse;font-size:13px}
.stbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);padding:6px 8px;border-bottom:1px solid var(--line)}
.stbl td{padding:8px;border-bottom:1px solid var(--line)}
.name-txt{font-weight:600;color:var(--ink)}
.pct-pill{background:var(--orangesoft);color:var(--oranged);border-radius:99px;padding:1px 10px;font-weight:700;font-size:12px}
.sbar{height:6px;border-radius:99px;background:var(--panel2);min-width:80px}.sbar i{display:block;height:100%;border-radius:99px;background:var(--orange)}

.item{cursor:pointer}
.tag.imp{background:var(--navy);color:#fff}
.tab.imp{color:var(--oranged)}
.imp-hdr{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.imp-hdr h2{margin:0;font-size:18px;color:var(--ink)}
.imp-hdr p{margin:2px 0 0;color:var(--mut);font-size:13px;max-width:780px}
.btn-back{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:600 12px 'Rubik',sans-serif;color:var(--ink);cursor:pointer;height:32px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-bottom:6px}
.leg-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.pill-st{border-radius:99px;padding:1px 10px;font-size:11px;font-weight:700}
.pill-st.ok{background:var(--greensoft);color:#0b8f66}.pill-st.ko{background:var(--redsoft);color:var(--red)}
tr.post td{background:var(--orangesoft)}
details.q{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:12px 16px}
details.q summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:13px}
details.q pre{overflow:auto;background:var(--panel2);border-radius:8px;padding:12px;font-size:12px;margin:10px 0 0}
.view-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button,.nav-b{border:none;background:none;border-radius:6px;padding:4px 10px;font:600 12px 'Rubik',sans-serif;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.nav-b{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.nav-b:hover{border-color:var(--orange)}
.cal-t{text-align:center;font-size:16px;font-weight:700;color:var(--ink);min-width:170px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shmd)}
.cal-h{background:var(--navy);color:#fff!important;padding:7px 5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);text-align:center}
.cal-c{background:var(--panel);min-height:96px;padding:5px;display:flex;flex-direction:column;gap:3px}
.cal-c.we{background:var(--we)}.cal-c.out{background:var(--panel2)}
.cal-d{font-size:11px;font-weight:600;color:var(--mut)}
.cal-c.today .cal-d{background:var(--orange);color:#fff;border-radius:99px;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
.chip-i{background:rgba(34,50,96,.09);color:var(--ink);border-left:3px solid var(--navy);border-radius:6px;padding:2px 6px;font-size:11px;transition:.12s;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-i:hover{background:var(--navy);color:#fff}
.chip-i.rb{background:var(--orangesoft);border-left-color:var(--orange);color:var(--oranged)}
.chip-i.im{border-left-color:var(--green)}
.leg2{display:flex;gap:14px;font-size:11px;color:var(--mut);margin-top:8px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}.chips{display:none}}

/* ===== pulido estético v2 ===== */
body{background:radial-gradient(1200px 500px at 85% -10%,rgba(237,139,8,.10),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(34,50,96,.07),transparent 60%),var(--bg);background-attachment:fixed}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#c9d1de;border-radius:99px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:var(--orange);background-clip:padding-box;border:2px solid transparent}
.page.active{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tabs{box-shadow:0 2px 10px rgba(15,24,52,.05)}
.tab{transition:.15s;border-radius:8px 8px 0 0}
.tab:hover{background:rgba(237,139,8,.07)}
.tab.active{background:linear-gradient(180deg,transparent,rgba(237,139,8,.10))}
.fbar{box-shadow:0 4px 14px rgba(15,24,52,.05)}
.fl input:focus,.ms-trigger:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(237,139,8,.18)}
.fcount{background:var(--panel2);padding:4px 12px;border-radius:99px;font-weight:600;color:var(--ink)}
/* calendario */
.view-bar{display:grid;grid-template-columns:1fr auto 1fr;background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:10px 14px;margin-bottom:12px}
.view-bar #calNav{grid-column:2;justify-self:center}
.view-bar .seg{grid-column:1;justify-self:start}
.cal-grid{border:none;gap:0;background:var(--panel)}
.cal-h{border-right:1px solid rgba(255,255,255,.08)}
.cal-c{border-right:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .12s}
.cal-c:nth-child(7n){border-right:none}
.cal-c:hover:not(.out){background:var(--hov)}
.cal-c.today{background:rgba(237,139,8,.07);box-shadow:inset 0 0 0 2px var(--orange)}
.cal-d{font-size:12px}
.chip-i{--cc:var(--navy);border-left-color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,var(--panel));color:var(--ink);box-shadow:0 1px 2px rgba(15,24,52,.06)}
.chip-i:hover{background:var(--cc);color:#fff;transform:translateX(2px)}
.chip-i.rb{background:color-mix(in srgb,var(--cc) 12%,var(--panel));color:var(--ink);outline:1.5px dashed var(--orange);outline-offset:-1.5px}
.chip-i.im::after{content:" 📈"}
.leg2{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:8px 14px;margin-top:10px}
.catleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--txt2);margin-top:8px;padding:0 4px}
.catleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
/* lista */
.month{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:13px}
.month::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.item{--cc:var(--navy);border-left-color:var(--cc);background:linear-gradient(135deg,var(--panel) 60%,color-mix(in srgb,var(--cc) 6%,var(--panel)))}
.item:hover{transform:translateY(-3px);box-shadow:var(--shpop)}
.item.fl-warn{box-shadow:inset 0 0 0 1.5px rgba(237,139,8,.35),var(--sh)}
.item h3{font-size:14px}
.tag{font-weight:600;border:1px solid rgba(34,50,96,.08)}
.tag.cat{border-color:transparent}
.tag.new{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(16,185,129,.15)}}
/* impacto */
.imp-hdr{background:linear-gradient(100deg,var(--panel),var(--hov2));border-radius:var(--r);box-shadow:var(--sh);padding:16px 20px;border-left:5px solid var(--orange)}
.btn-back{border-radius:10px;transition:.15s}.btn-back:hover{border-color:var(--orange);color:var(--oranged)}
.kpi{padding:14px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;background:rgba(34,50,96,.04)}
.kpi-icon{font-size:18px;display:block;margin:0 0 4px}
.kpi-lbl{display:block;margin-bottom:4px}
.kpi-val{font-size:26px;letter-spacing:-.02em}
.card{border:1px solid rgba(232,236,240,.8)}
.card-title{display:flex;align-items:center;gap:8px}
.card-title::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--orange)}
details.q summary{color:var(--ink)}
.empty{border:2px dashed var(--line);background:transparent}
.nav-b.arr{width:32px;height:32px;padding:0;border-radius:50%;font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);border:none;color:var(--ink);transition:.15s}
.nav-b.arr:hover{background:var(--orange);color:#fff;transform:scale(1.08)}
.nav-b.hoy{border:1.5px solid var(--orange);color:var(--oranged);border-radius:99px;padding:5px 16px;margin-left:6px;background:var(--panel)}
.nav-b.hoy:hover{background:var(--orange);color:#fff}
#calNav{gap:10px!important}
.cal-t{display:flex;align-items:baseline;justify-content:center;gap:8px;width:290px;min-width:290px;font-size:20px;font-weight:500;color:var(--ink)}
.cal-t b{font-weight:800;letter-spacing:-.01em}
.cal-yt{display:flex;justify-content:center;margin:0 0 14px}
.mc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mc{background:color-mix(in srgb,var(--mcc) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--mcc) 35%,var(--line));border-top:3px solid var(--mcc);border-radius:10px;padding:0 0 7px;display:flex;flex-direction:column;gap:3px;min-height:90px;overflow:hidden;box-shadow:var(--shmd)}
.mc.cur{box-shadow:0 0 0 2px var(--orange),var(--shmd)}
.mc-h{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;padding:5px 8px;margin-bottom:3px}
.mc.cur .mc-h{background:var(--orange)}
.mc-h b{font-size:13px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.mc-h span{font-size:9.5px;font-weight:700;background:rgba(255,255,255,.2);border-radius:99px;padding:1px 7px}
.mc-h.has{cursor:pointer}
.mc-b{display:flex;justify-content:space-between;color:#fff;font-size:11.5px;font-weight:600;border-radius:5px;padding:4px 7px;margin:0 7px;cursor:pointer;gap:4px;line-height:1.25}
.mc-b:hover{filter:brightness(1.12);transform:translateX(1px)}
.mc-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.mc-b i{font-style:normal;flex:none;font-size:9px}
.mc-e,.mc-m{font-size:10px;color:var(--mut);padding:0 8px}.mc-m{cursor:pointer;font-weight:700;color:var(--oranged)}.mc-m{cursor:pointer}
.cal-t .cy{color:var(--mut);font-weight:400}
.cal-t .cn{font-size:11px;font-weight:700;color:var(--oranged);background:var(--orangesoft);border-radius:99px;padding:3px 10px;align-self:center;margin-left:4px}
.cal-grid{position:relative}
.empty-m{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);border:1.5px dashed var(--line);border-radius:99px;padding:6px 18px;font-size:12px;font-weight:600;color:var(--mut);pointer-events:none;grid-column:1/-1}
.chip-i em{font-style:normal;font-size:9px;font-weight:700;opacity:.55;margin-left:6px;letter-spacing:.05em}
.chip-i:hover em{opacity:.85}
.cal-c{min-height:104px}
.cal-d{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:99px;color:var(--ink)}
.cal-c.we .cal-d{color:var(--mut)}
.cal-c.today .cal-d{box-shadow:0 2px 8px rgba(237,139,8,.5)}
.seg{box-shadow:inset 0 0 0 1px var(--line);border:none;background:var(--panel2);border-radius:10px;padding:3px}
.seg button{border-radius:8px;padding:6px 14px;transition:.15s}
.seg button.on{box-shadow:0 2px 6px rgba(34,50,96,.3)}
.hdr .logo-svg{filter:drop-shadow(0 1px 4px rgba(0,0,0,.25))}
.wrap::after{content:"HotelDO · HTML";display:block;text-align:center;margin-top:22px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);opacity:.7}

/* ===== v3: modo oscuro, vistas, panel, herramientas ===== */
html[data-theme=dark]{--bg:#0B1020;--panel:#151C33;--panel2:#1C2540;--line:#27325A;--txt:#E8ECF8;--txt2:#B8C2DC;--mut:#8A96B8;--ink:#E6EBF7;--we:#121A31;--hov:#1A2342;--hov2:#1A2342;--orangesoft:rgba(237,139,8,.18);--greensoft:rgba(16,185,129,.18);--redsoft:rgba(239,68,68,.18);--sh:0 1px 2px rgba(0,0,0,.35),0 4px 20px rgba(0,0,0,.3);--shmd:0 2px 8px rgba(0,0,0,.4),0 8px 32px rgba(0,0,0,.35)}
html[data-theme=dark] body{background:radial-gradient(1200px 500px at 85% -10%,rgba(237,139,8,.08),transparent 60%),var(--bg)}
html[data-theme=dark] .tag{background:rgba(255,255,255,.08)}
html[data-theme=dark] .kpi::after{background:rgba(255,255,255,.04)}
html[data-theme=dark] input[type=date]{color-scheme:dark}
html[data-theme=dark] .delta.up{color:#34d399}
html[data-theme=dark] .fcount,html[data-theme=dark] .cal-d{color:var(--txt)}
html.pres{zoom:1.1!important}
html.pres .fbar,html.pres .tabs{display:none}
html.pres .cal-c{min-height:124px}
html.pres .chip-i{font-size:12px}
html.pres .wrap::after{display:none}

/* header tools */
.hdr-r{display:flex;align-items:center;gap:14px}
.tools{display:flex;gap:6px}
.tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:5px 11px;font:600 12px 'Rubik',sans-serif;cursor:pointer;transition:.15s;white-space:nowrap}
.tbtn:hover{background:var(--orange);border-color:var(--orange)}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--navyd);color:#fff;padding:10px 20px;border-radius:99px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:400;box-shadow:var(--shpop)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tgl{height:30px;border:1px solid var(--line);background:var(--panel2);color:var(--txt2);border-radius:10px;padding:0 12px;font:600 12px 'Rubik',sans-serif;cursor:pointer;transition:.15s;white-space:nowrap}
.tgl:hover{border-color:var(--orange)}
.tgl.on{background:var(--orange);color:#fff;border-color:var(--orange)}

/* stats */
.kpis.mini{margin-bottom:12px}
.mini .kpi{display:flex;align-items:center;gap:12px;padding:10px 14px}
.mini .kpi-icon{width:40px;height:40px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:19px;margin:0;flex:none}
.mini .kpi-val{font-size:22px;line-height:1.1}
.mini .kpi-lbl{margin:0}
.mini .kpi-sub{margin-top:1px}

/* leyenda interactiva */
.catleg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px;padding:0}
.lg-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-right:4px}
.lg{--cc:#94A3B8;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--txt2);border-radius:99px;padding:4px 11px;font:600 11px 'Rubik',sans-serif;cursor:pointer;transition:.12s}
.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--cc);margin:0}
.lg small{color:var(--mut);font-weight:600}
.lg:hover{border-color:var(--cc);transform:translateY(-1px)}
.lg.on{background:var(--cc);color:#fff;border-color:var(--cc)}
.lg.on i{background:#fff}.lg.on small{color:rgba(255,255,255,.85)}
.lg.dim{opacity:.45}
.lg.clr{--cc:var(--orange);color:var(--oranged)}

/* calendario: chips con banderas */
.chip-i{display:flex;align-items:center;gap:4px}
.cn-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.fgs{display:inline-flex;gap:3px;flex:none;align-items:center}
.chip-i.im::after{flex:none}
.fg{height:11px;width:auto;border-radius:2px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.14)}
.more{background:none;border:none;color:var(--oranged);font:700 10px 'Rubik',sans-serif;text-align:left;cursor:pointer;padding:0 4px}
.more:hover{text-decoration:underline}
.cal-d.has{cursor:pointer}
.cal-d.has:hover{background:var(--orangesoft)}
.cal-t{width:340px;min-width:340px;white-space:nowrap}

/* vista semana */
.wk-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wk-col{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);min-height:340px;display:flex;flex-direction:column;overflow:hidden}
.wk-col.we{background:var(--we)}
.wk-col.today{box-shadow:inset 0 0 0 2px var(--orange),var(--sh)}
.wk-h{background:var(--navy);color:#fff;padding:8px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;display:flex;justify-content:space-between;align-items:center}
.wk-h b{font-size:17px}
.wk-col.today .wk-h{background:var(--orange)}
.wk-b{padding:8px;display:flex;flex-direction:column;gap:6px}
.wk-card{--cc:var(--navy);border-left:4px solid var(--cc);background:color-mix(in srgb,var(--cc) 10%,var(--panel));border-radius:8px;padding:7px 9px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink);transition:.12s}
.wk-card:hover{transform:translateY(-2px);box-shadow:var(--shmd)}
.wk-card.rb{outline:1.5px dashed var(--orange);outline-offset:-1.5px}
.wk-card small{display:flex;gap:4px;align-items:center;flex-wrap:wrap;color:var(--mut);font-weight:500;margin-top:4px;font-size:10px}
.wk-empty{color:var(--mut);opacity:.45;font-size:12px;text-align:center;margin-top:24px}

/* vista año */
.yr{background:var(--panel);border-radius:var(--r);box-shadow:var(--shmd);overflow:hidden}
.yr-grid{display:grid;grid-template-columns:200px repeat(12,minmax(0,1fr))}
.yr-h{background:var(--navy);color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:9px 4px;text-align:center}
.yr-l{padding:11px 12px;font-weight:600;font-size:12px;color:var(--ink);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.yr-l i{width:10px;height:10px;border-radius:3px;flex:none}
.yr-c{border-bottom:1px solid var(--line);border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;min-height:44px;font-weight:800;font-size:14px;transition:.12s}
.yr-c.has{cursor:pointer}
.yr-c.has:hover{transform:scale(1.08);box-shadow:var(--shmd);position:relative;z-index:2;border-radius:6px}
.yr-tot.yr-l,.yr-tot.yr-c{background:var(--panel2);font-weight:800;border-bottom:none}

/* lista */
#listCtl{grid-column:2;justify-self:center;display:none;gap:14px;align-items:center}
#listCtl label{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:6px}
#listCtl select{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px 10px;font:500 12px 'Rubik',sans-serif;color:var(--txt);cursor:pointer}
.gc{background:var(--orangesoft);color:var(--oranged);border-radius:99px;padding:1px 10px;font-size:11px;font-weight:700}
.item p.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag .fg{margin-right:3px}
.fg-all{font-size:11px}

/* panel lateral */
.d-bg{position:fixed;inset:0;background:rgba(15,24,52,.4);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s;z-index:300}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--panel);box-shadow:var(--shpop);transform:translateX(105%);transition:transform .25s ease;z-index:310;display:flex;flex-direction:column}
body.dopen .d-bg{opacity:1;pointer-events:auto}
body.dopen .drawer{transform:none}
.d-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;background:linear-gradient(100deg,#0F1834,#223260);color:#fff;border-bottom:3px solid var(--orange)}
.d-hd b{font-size:14px}
.d-hd button{background:rgba(255,255,255,.14);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;flex:none}
.d-hd button:hover{background:var(--orange)}
#dBody{padding:18px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.d-card{--cc:var(--navy);border-left:5px solid var(--cc);background:color-mix(in srgb,var(--cc) 8%,var(--panel));border-radius:12px;padding:14px 16px}
.d-card h3{margin:0 0 6px;font-size:17px;color:var(--ink);line-height:1.3}
.d-date{color:var(--mut);font-size:12px;margin-bottom:8px}
.d-sec label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:block;margin-bottom:6px}
.d-sec p{margin:0;color:var(--txt2);font-size:13px;line-height:1.55}
.d-ctys{display:flex;flex-wrap:wrap;gap:6px}
.d-cty{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--ink)}
.d-btn{background:linear-gradient(135deg,#F5A02A,var(--orange));color:#fff;border:none;border-radius:12px;padding:12px;font:700 13px 'Rubik',sans-serif;cursor:pointer;box-shadow:0 4px 12px rgba(237,139,8,.35)}
.d-btn:hover{filter:brightness(1.05)}
.d-lnkrow{display:flex;gap:8px}.d-lnkrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font:500 12px 'Rubik',sans-serif;background:var(--panel2);color:inherit}.d-lnkrow .d-btn{padding:9px 14px}
.d-lnk{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:6px;color:var(--mut)}.d-lnk small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.d-lnk button{background:none;border:none;color:var(--orange);font:600 11px 'Rubik',sans-serif;cursor:pointer;padding:2px 4px}
.d-btn.alt{background:var(--panel2);color:var(--orange);border:1.5px solid var(--line);box-shadow:none;margin-top:8px}
.d-noimp{background:var(--panel2);border:1.5px dashed var(--line);border-radius:12px;padding:12px;text-align:center;color:var(--mut);font-size:12px}
.d-back2{align-self:flex-start;background:none;border:none;color:var(--oranged);font:600 12px 'Rubik',sans-serif;cursor:pointer;padding:0}
.d-item{--cc:var(--navy);border-left:4px solid var(--cc);background:color-mix(in srgb,var(--cc) 8%,var(--panel));border-radius:10px;padding:10px 12px;cursor:pointer;transition:.12s}
.d-item:hover{transform:translateX(3px);box-shadow:var(--shmd)}
.d-item b{display:block;color:var(--ink);font-size:13px}
.d-item small{color:var(--mut);display:flex;gap:6px;align-items:center;margin-top:4px;font-size:11px}

/* responsive */
@media(max-width:900px){
  html{zoom:1!important}
  .hdr{height:auto;min-height:56px;flex-wrap:wrap;padding:8px 14px;gap:8px}
  .hdr-r{flex-wrap:wrap}.tools{flex-wrap:wrap}
  .tabs,.fbar,.wrap{padding-left:14px;padding-right:14px}
  .tabs,.fbar{position:static}
  .kpis.mini{grid-template-columns:repeat(2,1fr)}
  .view-bar{grid-template-columns:1fr;gap:10px}
  .view-bar #calNav,.view-bar .seg,#listCtl{grid-column:1;justify-self:center}
  .seg{flex-wrap:wrap}
  .cal-t{width:auto;min-width:0;font-size:16px}
  .cal-c{min-height:64px;padding:3px}.chip-i{font-size:9px}.fgs{display:none}
  .wk-grid{grid-template-columns:1fr}.wk-col{min-height:0}
  .yr{overflow:auto}.yr-grid{grid-template-columns:130px repeat(12,minmax(30px,1fr));min-width:560px}
  .row2{grid-template-columns:1fr}
}

@media print{
  @page{size:landscape;margin:8mm}

  .hdr{position:static}
  body{background:#fff}
  .page{animation:none}
}

  wrap.querySelector(".ms-panel").onclick=e=>e.stopPropagation();

  const its=rows.filter(d=>d.y===y&&d.m===m).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const n=its.length,cur=(y===NOWY&&m===NOWM);
  const tag=`data-yy="${y}" data-mm="${m}"`;
  const cc={};its.forEach(d=>cc[d.cat]=(cc[d.cat]||0)+1);
  const dom=Object.keys(cc).sort((a,b)=>cc[b]-cc[a])[0];
  let h=`<div class="mc ${cur?"cur":""}" style="--mcc:hsl(${m*30+8},80%,52%)"><div class="mc-h ${n?"has":""}" ${tag}><b>${MONTHS[m]} ${y}</b><span>${n} lanz.</span></div>`;
  if(!n)h+='<div class="mc-e">Sin lanzamientos</div>';
  its.slice(0,MAXCAT).forEach(d=>{h+=`<div class="mc-b" data-i="${DATA.indexOf(d)}" title="${esc(d.name)} · ${d.date.slice(8)}/${d.date.slice(5,7)} · ${d.cat}" style="background:linear-gradient(90deg,${itCol(d)},color-mix(in srgb,${itCol(d)} 68%,#000))"><span class="mc-n">${d.name}</span>${hasImp(d)?"<i>📈</i>":""}</div>`;});
  if(n>MAXCAT)h+=`<div class="mc-m" ${tag}>+${n-MAXCAT} más</div>`;
  return {h:h+"</div>",n};
}
function renderCal(rows){
  const years=[...new Set(DATA.map(d=>d.y).concat([NOWY,calY]))].sort();
  let list=[];
  if(calAll){
    const ks=DATA.map(d=>d.y*12+d.m);
    const lo=Math.min(...ks),hi=Math.max(NOWY*12+NOWM,...ks);
    for(let k=lo;k<=hi;k++)list.push([Math.floor(k/12),k%12]);
  }else for(let m=0;m<12;m++)list.push([calY,m]);
  let tot=0,body="";
  list.forEach(([y,m])=>{const g=monthCard(rows,y,m);tot+=g.n;body+=g.h;});
  setTitle(calAll?"<b>Todos</b>":`<b>${calY}</b>`,tot);
  const tabs="";
  $("cal").innerHTML=tabs+'<div class="mc-grid">'+body+"</div>"+'<div class="leg2"><span>Click en una iniciativa para ver el detalle · cada iniciativa tiene su color</span></div>';
}

/* ---------- vista semana ---------- */
const weekCard=d=>`<div class="wk-card ${isRb(d)?"rb":""}" style="--cc:${catCol(d.cat)}" data-i="${DATA.indexOf(d)}">${d.name}${hasImp(d)?" 📈":""}<small>${d.countries.map(flag).join("")}<span>${d.cat==="Sin categoría"?"":d.cat}</span></small></div>`;
function renderWeek(rows){
  const days=[...Array(7)].map((_,i)=>new Date(weekStart.getTime()+i*864e5));
  const keys=days.map(iso),by={};let n=0;
  rows.forEach(d=>{const i=keys.indexOf(d.date);if(i>=0){(by[i]=by[i]||[]).push(d);n++;}});
  const a=days[0],b=days[6];
  const lbl=a.getUTCMonth()===b.getUTCMonth()?`${a.getUTCDate()}–${b.getUTCDate()} ${MONTHS[b.getUTCMonth()]}`:`${a.getUTCDate()} ${MONTHS[a.getUTCMonth()]} – ${b.getUTCDate()} ${MONTHS[b.getUTCMonth()]}`;
  setTitle(`<b>${lbl}</b> <span class="cy">${b.getUTCFullYear()}</span>`,n);
  $("cal").innerHTML='<div class="wk-grid">'+days.map((dt,i)=>`<div class="wk-col ${i>=5?"we":""} ${keys[i]===TODAY_ISO?"today":""}"><div class="wk-h"><span>${DOW[i]}</span><b>${dt.getUTCDate()}</b></div><div class="wk-b">${(by[i]||[]).map(weekCard).join("")||'<div class="wk-empty">—</div>'}</div></div>`).join("")+"</div>"+LEG2;
}

/* ---------- vista año (línea de tiempo por categoría) ---------- */
function renderYear(rows){
  const yr=rows.filter(d=>d.y===calY);
  setTitle(`<b>${calY}</b>`,yr.length);
  const cats=CATS.filter(c=>yr.some(d=>d.cat===c));
  const cnt={},tot=Array(12).fill(0);
  yr.forEach(d=>{const k=d.cat+"|"+d.m;cnt[k]=(cnt[k]||0)+1;tot[d.m]++;});
  const max=Math.max(1,...Object.values(cnt));
  let h='<div class="yr"><div class="yr-grid"><div class="yr-h" style="text-align:left;padding-left:12px">Categoría</div>'+MONTHS.map(m=>`<div class="yr-h">${m}</div>`).join("");
  cats.forEach(c=>{
    h+=`<div class="yr-l"><i style="background:${catCol(c)}"></i>${c}</div>`;
    for(let m=0;m<12;m++){
      const v=cnt[c+"|"+m]||0,r=v/max;
      h+=v?`<div class="yr-c has" data-k="${esc(c)}" data-mm="${m}" style="background:color-mix(in srgb,${catCol(c)} ${Math.round(18+r*72)}%,var(--panel));color:${r>.6?"#fff":"var(--ink)"}">${v}</div>`:'<div class="yr-c"></div>';
    }
  });
  h+='<div class="yr-tot yr-l">Total</div>'+tot.map(v=>`<div class="yr-tot yr-c">${v||""}</div>`).join("");
  $("cal").innerHTML=h+'</div></div>'+(yr.length?"":'<div class="empty" style="margin-top:12px">Sin iniciativas en este año con los filtros actuales.</div>')+'<div class="leg2"><span>Click en un número para ver las iniciativas de esa categoría y mes</span></div>';
}

/* ---------- vista lista ---------- */
const cmpMap={"date-desc":(a,b)=>b.date.localeCompare(a.date),"date-asc":(a,b)=>a.date.localeCompare(b.date),name:(a,b)=>a.name.localeCompare(b.name,"es"),cat:(a,b)=>a.cat.localeCompare(b.cat,"es")||b.date.localeCompare(a.date)};
const card=d=>{
  const age=(NOW-new Date(d.date))/864e5,[y,mo,da]=d.date.split("-");
  return `<article class="item ${isRb(d)?"fl-warn":""}" style="--cc:${catCol(d.cat)}" data-i="${DATA.indexOf(d)}" title="Click para ver el detalle">
    <div class="tags">${hasImp(d)?'<span class="tag imp">📈 Impacto disponible</span>':""}${age<=14&&age>=0?'<span class="tag new">Nuevo</span>':""}${isRb(d)?'<span class="tag warn">Apagado/rollback</span>':""}</div>
    <h3>${d.name}</h3><div class="date">${da}/${mo}/${y}</div>
    ${d.note?`<p class="clamp">${d.note}</p>`:""}
    <div class="tags">${d.countries.map(c=>`<span class="tag">${flag(c)} ${c}</span>`).join("")}${d.cat!=="Sin categoría"?`<span class="tag cat" style="background:${catCol(d.cat)}22;color:${catCol(d.cat)}">${d.cat}</span>`:""}</div>
  </article>`;
};
function renderListView(rows){
  if(!rows.length){$("list").innerHTML='<div class="empty">Sin resultados para estos filtros.</div>';return;}
  const inner=groupBy==="cat"?(a,b)=>a.cat.localeCompare(b.cat,"es")||cmpMap[sortBy](a,b):cmpMap[sortBy];
  const sorted=[...rows].sort(inner);
  const gk={month:d=>`${MONTHS_L[d.m]} ${d.y}`,year:d=>String(d.y),cat:d=>d.cat,none:()=>""}[groupBy];
  const groups=new Map();
  sorted.forEach(d=>{const k=gk(d);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(d);});
  let entries=[...groups];
  if(groupBy==="month"||groupBy==="year"){
    const mn=arr=>arr.reduce((m,d)=>d.date<m?d.date:m,"9999");
    const dir=sortBy==="date-asc"?1:-1;
    entries.sort((a,b)=>dir*mn(a[1]).localeCompare(mn(b[1])));
  }
  $("list").innerHTML=entries.map(([k,arr])=>(k?`<div class="month">${k}<span class="gc">${arr.length}</span></div>`:"")+'<div class="items">'+arr.map(card).join("")+"</div>").join("");
}
function renderList(rows){
  const isList=view==="list";
  $("cal").style.display=isList?"none":"";
  $("list").style.display=isList?"":"none";
  $("calNav").style.display=isList?"none":"flex";
  {const pb=$("calNav").querySelector("[data-n=\"-1\"]");pb.disabled=view!=="week"&&calY<=MINY;pb.style.opacity=pb.disabled?".35":"";pb.style.cursor=pb.disabled?"default":"";}
  $("listCtl").style.display=isList?"flex":"none";
  [...$("vSeg").children].forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  if(view==="cal")renderCal(rows);else if(view==="week")renderWeek(rows);else if(view==="year")renderYear(rows);else renderListView(rows);
}

/* links al impacto cargados a mano: se guardan en Apps Script y los ven todos (window.IMPACT_LINKS lo inyecta Code.gs) */

let curImpact=null;

let impGran="d";
function renderImpact(){
  const d=curImpact; if(!d)return;
  const [y,mo,da]=d.date.split("-");
  const cfg=IMPACT[d.name+"|"+d.date];
  if(cfg&&cfg.kind==="ldp"){renderLdp(d,cfg);return;}
  if(cfg&&cfg.kind==="hdo"){renderHdo(d,cfg);return;}
  const head=`<div class="imp-hdr one"><div class="imp-line"><span class="imp-eye">Impacto de iniciativa</span><h2>${d.name}</h2>
    <span class="imp-meta">Prendida el <b>${da}/${mo}/${y}</b>${cfg?` · datos al ${fdate(cfg.asof)} (hoy parcial)`:""}</span>
    <span class="tags">${d.countries.map(c=>`<span class="tag">${flag(c)} ${CN[c]||c}</span>`).join("")}${d.cat!=="Sin categoría"?`<span class="tag cat" style="background:${catCol(d.cat)}22;color:${catCol(d.cat)}">${d.cat}</span>`:""}</span></div>
    <button class="btn-back" id="impBack">← Volver a iniciativas</button></div>`;
  if(!cfg){
    $("impact").innerHTML=head+`<div class="empty">📭 Todavía no hay query cargada para esta iniciativa.<br>Pasame la query y armo su tab de impacto.</div>`;
    $("impBack").onclick=()=>setPage("lista"); return;
  }
  // reservas: [fecha, estado, partner_id, agencia, reserva, gb]
  cfg.bookings=cfg.bookings.filter(r=>!/test/i.test(r[3]));   // se excluyen agencias de prueba
  const inPost=r=>r[0]>=cfg.launch&&r[0]<cfg.partial;
  const okB=cfg.bookings.filter(r=>r[1]==="Confirmado"&&inPost(r)), koB=cfg.bookings.filter(r=>r[1]==="Cancelado"&&inPost(r));
  const gbM=okB.reduce((s,r)=>s+r[5],0), okN=okB.length, koN=koB.length;
  const gbT=cfg.daily.filter(r=>r[0]>=cfg.launch&&r[0]<cfg.partial).reduce((s,r)=>s+r[2],0);   // GB confirmado total, todos los medios de pago
  const share=gbT?gbM/gbT*100:0;
  const agN=uniq(okB.map(r=>r[2])).length;
  const since=`desde el ${fdate(cfg.launch)}`;
  const kpis=[
    ["kpi-g kpi-hero","💰","GB confirmado",`<span class="u">USD</span>${fmtN(gbM)}`,`<span class="delta nd">${since}</span>`],
    ["kpi-b","📊","Share del medio de pago",share.toFixed(1).replace(".",",")+"%",`<span class="delta nd">del GB confirmado total · USD ${fmtN(gbT)}</span>`],
    ["kpi-c","🧾","Bookings confirmados",okN,`<span class="delta ${koN?"dn":"nd"}">${koN} canceladas</span>`],
    ["kpi-p","🏢","Agencias que lo usaron",agN,`<span class="delta nd">con al menos 1 reserva confirmada</span>`]
  ];
  const rowsT=[...cfg.bookings].sort((a,b)=>b[0].localeCompare(a[0])||a[1].localeCompare(b[1])).map(r=>`<tr class="${inPost(r)?"post":"pre"}"><td class="dt">${fdate(r[0])}</td><td><span class="pill-st ${r[1]==="Confirmado"?"ok":"ko"}">${r[1]==="Confirmado"?"Confirmada":"Cancelada"}</span></td><td><div class="ag"><span class="av" style="background:${PAL[[...r[3]].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length]}">${r[3].trim()[0].toUpperCase()}</span><div><b class="name-txt">${r[3]}</b><small class="aid">${r[2]}</small></div></div></td><td class="rsv">${r[4]}</td><td class="num"><b>USD ${fmtN(r[5])}</b></td><td><span class="mom ${inPost(r)?"mp":"mo"}">${inPost(r)?"Post-lanzamiento":"Pre-lanzamiento"}</span></td></tr>`).join("");
  $("impact").innerHTML=head+
   `<div class="kpis k3 mini">${kpis.map(([c,i,l,v,s])=>`<div class="kpi ${c}"><div class="kpi-icon">${i}</div><div class="kpi-body"><div class="kpi-lbl">${l}</div><div class="kpi-val">${v}</div><div class="kpi-sub">${s}</div></div></div>`).join("")}</div>
    <div class="card"><div class="card-hdr"><div><div class="card-title">Evolución del GB confirmado</div><div class="card-sub">USD con este medio de pago, ${since}</div></div>
      <div class="gran impGran"><button data-g="d">Día</button><button data-g="w">Semana</button><button data-g="m">Mes</button></div></div>
      <div class="ch"><canvas id="cImpG"></canvas></div></div>
    <div class="card"><div class="card-hdr"><div><div class="card-title">Evolución del share del medio de pago</div><div class="card-sub">% del GB confirmado total de AR que se pagó con este medio, ${since} · el último día es parcial</div></div>
      <div class="gran impGran"><button data-g="d">Día</button><button data-g="w">Semana</button><button data-g="m">Mes</button></div></div>
      <div class="ch"><canvas id="cImpS"></canvas></div></div>

    <details class="q"><summary>Ver detalle de reservas · ${okN} confirmadas · ${koN} canceladas desde el lanzamiento</summary>
      <table class="stbl" style="margin-top:10px"><thead><tr><th>Fecha</th><th>Estado</th><th>Agencia</th><th>Reserva</th><th class="num">GB</th><th>Momento</th></tr></thead><tbody>${rowsT}</tbody></table>
      <div class="card-sub" style="margin-top:8px">Las filas de pre-lanzamiento son anteriores al ${fdate(cfg.launch)} y no cuentan en las métricas.</div></details>`;
  $("impBack").onclick=()=>setPage("lista");

  // gráfico de evolución con granularidad día / semana / mes
  const days=[];for(let t=new Date(cfg.launch+"T00:00:00Z");iso(t)<=cfg.asof;t=new Date(t.getTime()+864e5))days.push(iso(t));
  const keyOf=(dd,g)=>g==="d"?dd:g==="w"?iso(mondayOf(new Date(dd+"T00:00:00Z"))):dd.slice(0,7);
  const lblOf=(k,g)=>g==="d"?fdate(k):g==="w"?"Sem "+fdate(k):MONTHS_L[+k.slice(5)-1]+" "+k.slice(2,4);
  const XT={d:"Día",w:"Semana (inicia el lunes)",m:"Mes"};
  function draw(){
    const m=new Map();
    days.forEach(dd=>{const k=keyOf(dd,impGran);if(!m.has(k))m.set(k,0);});
    okB.forEach(r=>{const k=keyOf(r[0],impGran);m.set(k,(m.get(k)||0)+r[5]);});
    const ks=[...m.keys()].sort();
    document.querySelectorAll(".impGran").forEach(g=>[...g.children].forEach(b=>b.classList.toggle("active",b.dataset.g===impGran)));
    chart("cImpG",{type:"bar",data:{labels:ks.map(k=>lblOf(k,impGran)),datasets:[{data:ks.map(k=>Math.round(m.get(k))),backgroundColor:c=>{const a=c.chart.chartArea;if(!a)return ORANGE;const g=c.chart.ctx.createLinearGradient(0,a.top,0,a.bottom);g.addColorStop(0,"#F7B955");g.addColorStop(1,"#ED8B08");return g;},borderRadius:{topLeft:8,topRight:8},maxBarThickness:72}]},
      options:{...baseOpts,plugins:{legend:{display:false},tooltip:{backgroundColor:"#0F1834",padding:10,cornerRadius:8,displayColors:false,callbacks:{label:c=>"GB confirmado: USD "+fmtN(c.parsed.y)}},vlabels:{on:true,size:11,fmt:v=>"USD "+fmtN(v)}},
        scales:{y:{beginAtZero:true,grace:"18%",grid:{color:"rgba(100,116,139,.15)",borderDash:[4,4]},title:{display:true,text:"GB (USD)",color:"#64748B",font:{size:11,weight:"600"}}},
                x:{grid:{display:false},title:{display:true,text:XT[impGran],color:"#64748B",font:{size:11,weight:"600"}}}}}});
    // share del medio de pago sobre el GB confirmado total, por período
    const totB=new Map();
    cfg.daily.filter(r=>r[0]>=cfg.launch&&r[0]<=cfg.asof).forEach(r=>{const k=keyOf(r[0],impGran);totB.set(k,(totB.get(k)||0)+r[2]);});
    const sh=ks.map(k=>totB.get(k)?Math.round(m.get(k)/totB.get(k)*10000)/100:0);
    const fmtP=v=>v.toFixed(1).replace(".",",")+"%";
    chart("cImpS",{type:"line",data:{labels:ks.map(k=>lblOf(k,impGran)),datasets:[{data:sh,borderColor:"#3B82F6",borderWidth:3,tension:.35,fill:true,
        backgroundColor:c=>{const a=c.chart.chartArea;if(!a)return "rgba(59,130,246,.15)";const g=c.chart.ctx.createLinearGradient(0,a.top,0,a.bottom);g.addColorStop(0,"rgba(59,130,246,.30)");g.addColorStop(1,"rgba(59,130,246,0)");return g;},
        pointRadius:6,pointHoverRadius:8,pointBackgroundColor:"#fff",pointBorderColor:"#3B82F6",pointBorderWidth:3}]},
      options:{...baseOpts,plugins:{legend:{display:false},
        tooltip:{backgroundColor:"#0F1834",padding:10,cornerRadius:8,displayColors:false,callbacks:{label:c=>"Share: "+fmtP(c.parsed.y),afterLabel:c=>"USD "+fmtN(m.get(ks[c.dataIndex]))+" de USD "+fmtN(totB.get(ks[c.dataIndex])||0)}},
        vlabels:{on:true,size:11,zero:true,fmt:fmtP}},
        scales:{y:{beginAtZero:true,grace:"35%",grid:{color:"rgba(100,116,139,.15)",borderDash:[4,4]},ticks:{callback:v=>v+"%"},title:{display:true,text:"% del GB",color:"#64748B",font:{size:11,weight:"600"}}},
                x:{grid:{display:false},title:{display:true,text:XT[impGran],color:"#64748B",font:{size:11,weight:"600"}}}}}});
  }
  document.querySelectorAll(".impGran").forEach(el=>el.onclick=e=>{const g=e.target.dataset.g;if(!g)return;impGran=g;draw();});
  draw();
}

/* ---------- impacto: link de pago en hoteles non ref (multi-país, escalonado) ---------- */
function renderLdp(d,cfg){

      <div class="ch"><canvas id="cLdpV"></canvas></div></div>
    <div class="card"><div class="card-hdr"><div><div class="card-title">¿Canibaliza otros medios de pago?</div><div class="card-sub" id="mixSub"></div></div>
      <div class="gran" id="mixCty"><button data-c="ALL">Todos</button>${C.map(r=>`<button data-c="${r[0]}" title="${CN[r[0]]||r[0]}">${flag(r[0])}</button>`).join("")}</div></div>
      <div style="display:grid;grid-template-columns:5fr 6fr;gap:14px;align-items:stretch">
        <div><table class="stbl"><thead><tr><th>Medio de pago</th><th class="num">Antes</th><th class="num">Después</th><th class="num">Cambio</th></tr></thead><tbody id="mixTb"></tbody></table></div>
        <div class="ch" style="height:260px"><canvas id="cMix"></canvas></div></div>
      <div class="card-sub" id="mixIns" style="margin-top:10px;font-weight:600"></div>
      <div class="card-sub" style="margin-top:6px">Mix del GB de hoteles no reembolsables confirmados. Antes = semanas completas desde el 31/8 hasta la prendida; después = semanas completas desde la prendida (MX desde el 13/10, cuando terminó el rollout; el 29/9 fue solo prueba en classic). El link de pago ya existía en non ref antes de la prendida, por eso no parte de cero. Esto muestra cambios de mix, no causalidad: el total vendido también se mueve por estacionalidad y por otras iniciativas, eso se mide en el contrafactual.</div></div>
    <details class="q"><summary>Ver top 10 agencias por GB con link de pago · ${pf(cfg.top.reduce((a,r)=>a+r[4],0)/T.gl*100)} del GB del link</summary>
      <table class="stbl" style="margin-top:10px"><thead><tr><th>#</th><th>Agencia</th><th>País</th><th class="num">Bookings</th><th class="num">GB</th></tr></thead><tbody>${cfg.top.map((r,i)=>`<tr><td class="dt">${i+1}</td><td><div class="ag"><span class="av" style="background:${PAL[[...r[1]].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length]}">${r[1].trim()[0].toUpperCase()}</span><div><b class="name-txt">${r[1]}</b><small class="aid">${r[0]}</small></div></div></td><td>${flag(r[2])} ${CN[r[2]]||r[2]}</td><td class="num">${r[3]}</td><td class="num"><b>USD ${fmtN(r[4])}</b></td></tr>`).join("")}</tbody></table>
      <div class="card-sub" style="margin-top:8px">Reservas confirmadas desde el lanzamiento de cada país. Se excluyen agencias con "test" en el nombre.</div></details>`;
  $("impBack").onclick=()=>setPage("lista");
  const keyOf=(dd,g)=>g==="d"?dd:g==="w"?iso(mondayOf(new Date(dd+"T00:00:00Z"))):dd.slice(0,7);
  const lblOf=(k,g)=>g==="d"?fdate(k):g==="w"?"Sem "+fdate(k):MONTHS_L[+k.slice(5)-1]+" "+k.slice(2,4);
  const XT={d:"Día",w:"Semana (inicia el lunes)",m:"Mes"};
  let ldpMode="all";
  const grid={color:"rgba(100,116,139,.15)",borderDash:[4,4]};
  const tt={backgroundColor:"#0F1834",padding:10,cornerRadius:8};
  function draw(){
    const m=new Map();
    cfg.daily.forEach(r=>{const k=keyOf(r[0],impGran);const a=m.get(k)||[0,0,0,0];a[0]+=r[1];a[1]+=r[2];a[2]+=r[3];a[3]+=r[7];m.set(k,a);});
    const ks=[...m.keys()].sort(), lb=ks.map(k=>lblOf(k,impGran));
    document.querySelectorAll(".impGran").forEach(g=>[...g.children].forEach(b=>b.classList.toggle("active",b.dataset.g===impGran)));
    const sh=ks.map(k=>m.get(k)[3]?Math.round(m.get(k)[2]/m.get(k)[3]*10000)/100:0);
    chart("cLdpS",{type:"line",data:{labels:lb,datasets:[{data:sh,borderColor:"#ED8B08",borderWidth:3,tension:.35,fill:true,
        backgroundColor:c=>{const a=c.chart.chartArea;if(!a)return "rgba(237,139,8,.15)";const g=c.chart.ctx.createLinearGradient(0,a.top,0,a.bottom);g.addColorStop(0,"rgba(237,139,8,.30)");g.addColorStop(1,"rgba(237,139,8,0)");return g;},
        pointRadius:impGran==="d"?3:6,pointHoverRadius:7,pointBackgroundColor:"#fff",pointBorderColor:"#ED8B08",pointBorderWidth:2}]},
      options:{...baseOpts,plugins:{legend:{display:false},
        tooltip:{...tt,displayColors:false,callbacks:{label:c=>"Share: "+pf(c.parsed.y),afterLabel:c=>"USD "+fmtN(m.get(ks[c.dataIndex])[2])+" de USD "+fmtN(m.get(ks[c.dataIndex])[3])}},
        vlabels:{on:true,size:impGran==="d"?9:11,zero:true,fmt:pf}},
        scales:{y:{beginAtZero:true,grace:"30%",grid,ticks:{callback:v=>v+"%"},title:{display:true,text:"% del GB",color:"#64748B",font:{size:11,weight:"600"}}},
                x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true},title:{display:true,text:XT[impGran],color:"#64748B",font:{size:11,weight:"600"}}}}}});
    const link=ldpMode==="link";
    const ds=link?[["Otros medios no reembolsables",k=>m.get(k)[1],"#94A3B8","#1E293B"],["Link de pago",k=>m.get(k)[2],"#ED8B08"]]
                 :[["Reembolsable",k=>m.get(k)[0],"#3B82F6"],["No reembolsable",k=>m.get(k)[1]+m.get(k)[2],"#ED8B08"]];
    $("ldpVs").textContent=link?"GB confirmado en USD (etiquetas en miles) · solo hoteles no reembolsables: link de pago vs otros medios de pago · MX, AR, CL, BR, CO y PE"
                               :"GB confirmado en USD (etiquetas en miles) · incluye todos los medios de pago · MX, AR, CL, BR, CO y PE";
    document.querySelectorAll("#ldpMode button").forEach(b=>b.classList.toggle("active",b.dataset.m===ldpMode));
    chart("cLdpV",{type:"bar",data:{labels:lb,datasets:ds.map(([n,f,col,lc],i)=>({label:n,lc,data:ks.map(k=>Math.round(f(k))),backgroundColor:col,borderRadius:i===1?{topLeft:6,topRight:6}:0,maxBarThickness:64}))},
      options:{...baseOpts,plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:10,boxHeight:10,usePointStyle:true,font:{size:11}}},
        tooltip:{...tt,callbacks:{label:c=>c.dataset.label+": USD "+fmtN(c.parsed.y),footer:it=>"Total: USD "+fmtN(it.reduce((a,x)=>a+x.parsed.y,0))}},vlabels:{on:false},stacklabels:{on:true,size:impGran==="d"?9:11}},
        scales:{y:{stacked:true,beginAtZero:true,grid,title:{display:true,text:"GB (USD)",color:"#64748B",font:{size:11,weight:"600"}}},
                x:{stacked:true,grid:{display:false},ticks:{maxRotation:0,autoSkip:true},title:{display:true,text:XT[impGran],color:"#64748B",font:{size:11,weight:"600"}}}}}});
  }
  document.querySelectorAll(".impGran").forEach(el=>el.onclick=e=>{const g=e.target.dataset.g;if(!g)return;impGran=g;draw();});
  $("ldpMode").onclick=e=>{const g=e.target.dataset.m;if(!g)return;ldpMode=g;draw();};
  const MG=["Link de pago","Tarjeta crédito","Débito","Cash","Cuenta corriente","HDO pay","Pago diferido","Otros"];
  const MGC={"Link de pago":"#ED8B08","Tarjeta crédito":"#3B82F6","Débito":"#06B6D4","Cash":"#10B981","Cuenta corriente":"#6366F1","HDO pay":"#8B5CF6","Pago diferido":"#EC4899","Otros":"#94A3B8"};
  let mixC="ALL";
  function drawMix(){
    const mix=cfg.mix||[],cmp=cfg.mixcmp||{};
    const addD=(w,n)=>iso(new Date(new Date(w+"T00:00:00Z").getTime()+n*864e5));
    const full=w=>addD(w,7)<=cfg.asof;
    const pre={},post={},pw=new Set(),qw=new Set(),byW={};
    MG.forEach(g=>{pre[g]=0;post[g]=0;});
    mix.forEach(([w,c,g,n,gb])=>{
      if(!full(w)||(mixC!=="ALL"&&c!==mixC))return;
      const ld=cmp[c];if(!ld)return;
      (byW[w]=byW[w]||{})[g]=(byW[w][g]||0)+gb;
      if(addD(w,6)<ld){pre[g]+=gb;pw.add(c+w);}else if(w>=ld){post[g]+=gb;qw.add(c+w);}
    });
    const tp=MG.reduce((a,g)=>a+pre[g],0),tq=MG.reduce((a,g)=>a+post[g],0);
    const sp=g=>tp?pre[g]/tp*100:0,sq=g=>tq?post[g]/tq*100:0;
    const rowsM=MG.filter(g=>pre[g]||post[g]).map(g=>{const dl=sq(g)-sp(g);
      return `<tr><td><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${MGC[g]};margin-right:6px"></span>${g}</td><td class="num">${pf(sp(g))}</td><td class="num">${pf(sq(g))}</td><td class="num"><b style="color:${Math.abs(dl)<0.5?"var(--mut)":dl>0?"#059669":"#DC2626"}">${dl>0?"+":""}${dl.toFixed(1).replace(".",",")} pp</b></td></tr>`;}).join("");
    $("mixTb").innerHTML=rowsM;
    const nPre=mixC==="ALL"?"":" · antes "+(new Set([...pw].map(x=>x.slice(2)))).size+" sem, después "+(new Set([...qw].map(x=>x.slice(2)))).size+" sem";
    $("mixSub").textContent="Participación de cada medio en el GB de hoteles non ref, antes vs después de la prendida"+(mixC==="ALL"?" (cada país con su fecha)":" · "+(CN[mixC]||mixC)+nPre);
    const others=MG.filter(g=>g!=="Link de pago"&&(pre[g]||post[g])).map(g=>[g,sq(g)-sp(g)]).sort((a,b)=>a[1]-b[1]);
    const lk=sq("Link de pago")-sp("Link de pago"),top=others[0];
    $("mixIns").textContent=top?`Link de pago ${lk>=0?"+":""}${lk.toFixed(1).replace(".",",")} pp. Medio que más cede: ${top[0]} (${top[1].toFixed(1).replace(".",",")} pp).`:"";
    document.querySelectorAll("#mixCty button").forEach(b=>b.classList.toggle("active",b.dataset.c===mixC));
    const wk=Object.keys(byW).sort();
    chart("cMix",{type:"bar",data:{labels:wk.map(w=>"Sem "+fdate(w)),datasets:MG.map(g=>{const t=w=>MG.reduce((a,x)=>a+(byW[w][x]||0),0);
        return {label:g,data:wk.map(w=>t(w)?Math.round((byW[w][g]||0)/t(w)*1000)/10:0),backgroundColor:MGC[g],maxBarThickness:48};})},
      options:{...baseOpts,plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:10,boxHeight:10,usePointStyle:true,font:{size:11}}},
        tooltip:{...tt,callbacks:{label:c=>c.dataset.label+": "+pf(c.parsed.y)}},vlabels:{on:false},stacklabels:{on:false}},
        scales:{y:{stacked:true,beginAtZero:true,max:100,grid,ticks:{callback:v=>v+"%"},title:{display:true,text:"% del GB non ref",color:"#64748B",font:{size:11,weight:"600"}}},
                x:{stacked:true,grid:{display:false},ticks:{maxRotation:0,autoSkip:true}}}}});
  }
  $("mixCty").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;mixC=b.dataset.c;drawMix();};
  draw();
  drawMix();
}

        tooltip:{...tt,displayColors:false,callbacks:{label:c=>"GB con HDO pay: USD "+fmtN(c.parsed.y),afterLabel:c=>fmtN(m.get(ks[c.dataIndex])[0])+" reservas"}},
        vlabels:{on:true,size:impGran==="d"?9:11,zero:true,fmt:v=>"USD "+fmtN(v)}},
        scales:{y:{beginAtZero:true,grace:"18%",grid,title:{display:true,text:"GB (USD)",color:"#64748B",font:{size:11,weight:"600"}}},
                x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true},title:{display:true,text:XT[impGran],color:"#64748B",font:{size:11,weight:"600"}}}}}});
  }
  document.querySelectorAll(".impGran").forEach(el=>el.onclick=e=>{const g=e.target.dataset.g;if(!g)return;impGran=g;draw();});
  draw();
}

function render(){
  if($("p-impacto").classList.contains("active")){renderImpact();return;}
  const rows=DATA.filter(match);
  $("fcount").textContent=`${rows.length} de ${DATA.length} iniciativas`;
  $("chipTotal").textContent=`📋 ${DATA.length} iniciativas`;
  const dates=DATA.map(d=>d.date).sort();
  const f=s=>`${MONTHS[+s.slice(5,7)-1]} ${s.slice(0,4)}`;
  $("chipRange").textContent=`📅 ${f(dates[0])} - ${f(dates[dates.length-1])}`;
  renderList(rows);saveHash();
}

/* ---------- eventos ---------- */
$("q").oninput=e=>{F.q=e.target.value;render();};
$("fImp").onchange=e=>{F.imp=e.target.checked;render();};
$("tabs").onclick=e=>{const p=e.target.dataset.p;if(!p)return;setPage(p);};
/* ---------- navegación, herramientas, link compartible ---------- */
const root=document.documentElement;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function setZoom(z){const v=Math.min(1.3,Math.max(.6,Math.round(z*100)/100));root.style.zoom=v;store.set("zoom",v);}
function setTheme(t){root.dataset.theme=t;$("bTheme").textContent=t==="dark"?"☀️":"🌙";store.set("theme",t);}
function togglePres(){root.classList.toggle("pres");$("bPres").textContent=root.classList.contains("pres")?"✕ Salir":"🖥 Presentar";}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200);}

function saveHash(){
  try{
    const p=new URLSearchParams();
    p.set("v",view);p.set("y",calY);p.set("m",calM+1);
    if(view==="week")p.set("w",iso(weekStart));
    if(F.country.length)p.set("c",F.country.join(","));
    if(F.year.length)p.set("a",F.year.join(","));
    if(F.q)p.set("q",F.q);
    if(F.imp)p.set("imp","1");
    if(view==="list"){p.set("s",sortBy);p.set("g",groupBy);}
    if(root.dataset.theme==="dark")p.set("th","d");
    history.replaceState(null,"","#"+p.toString());
  }catch(e){}
}
function loadHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  if(["cal","week","year","list"].includes(p.get("v")))view=p.get("v");
  if(+p.get("y")>2000)calY=+p.get("y");
  if(+p.get("m")>=1&&+p.get("m")<=12)calM=+p.get("m")-1;
  if(/^\d{4}-\d\d-\d\d$/.test(p.get("w")||""))weekStart=mondayOf(new Date(p.get("w")+"T00:00:00Z"));
  if(p.get("c"))MS.country(p.get("c").split(","));
  if(p.get("a"))MS.year(p.get("a").split(","));
  if(p.get("q")){F.q=p.get("q");$("q").value=F.q;}
  if(p.get("imp")==="1"){F.imp=true;$("fImp").checked=true;}
  if(cmpMap[p.get("s")]){sortBy=p.get("s");}
  if(["month","year","cat","none"].includes(p.get("g")))groupBy=p.get("g");
  $("sortSel").value=sortBy;$("grpSel").value=groupBy;
  setTheme(p.get("th")==="d"?"dark":(store.get("theme")||"light"));
}
function step(n){
  if(n===0){calAll=false;calY=NOWY;calM=NOWM;weekStart=mondayOf(NOW);}
  else if(view==="week"){weekStart=new Date(weekStart.getTime()+n*7*864e5);calY=weekStart.getUTCFullYear();calM=weekStart.getUTCMonth();}
  else{calAll=false;calY=Math.max(MINY,calY+n);}
  render();
}

$("cal").onclick=e=>{
  const yb=e.target.closest(".cal-yt [data-y]");
  if(yb){calAll=yb.dataset.y==="all";if(!calAll)calY=+yb.dataset.y;render();return;}
  const mi=e.target.closest(".mc-b");
  if(mi){openDrawer([DATA[+mi.dataset.i]]);return;}
  const mc=e.target.closest(".mc-h.has,.mc-m");
  if(mc){const yy=+mc.dataset.yy,mm=+mc.dataset.mm;openDrawer(DATA.filter(d=>match(d)&&d.y===yy&&d.m===mm),MONTHS_L[mm]+" "+yy);return;}
  const c=e.target.closest(".chip-i,.wk-card");
  if(c){openDrawer([DATA[+c.dataset.i]]);return;}
  const m=e.target.closest(".more,.cal-d.has");
  if(m){openDrawer(DATA.filter(d=>d.date===m.dataset.day&&match(d)),longDate(m.dataset.day));return;}
  const y=e.target.closest(".yr-c.has");
  if(y){const k=y.dataset.k,mm=+y.dataset.mm;openDrawer(DATA.filter(d=>match(d)&&d.y===calY&&d.m===mm&&d.cat===k),`${k} · ${MONTHS_L[mm]} ${calY}`);}
};
$("list").onclick=e=>{const a=e.target.closest(".item");if(a)openDrawer([DATA[+a.dataset.i]]);};
$("calNav").onclick=e=>{const b=e.target.closest("[data-n]");if(b)step(+b.dataset.n);};
$("vSeg").onclick=e=>{
  const b=e.target.closest("[data-v]");if(!b)return;const v=b.dataset.v;
  if(v==="week"&&view!=="week")weekStart=mondayOf((calY===NOWY&&calM===NOWM)?NOW:new Date(Date.UTC(calY,calM,1)));
  view=v;render();
};
$("sortSel").onchange=e=>{sortBy=e.target.value;render();};
$("grpSel").onchange=e=>{groupBy=e.target.value;render();};
$("dBody").onclick=e=>{
  const it=e.target.closest(".d-item");if(it){showDetail(DATA[+it.dataset.i],true);return;}
  if(e.target.closest("#dBackL")&&lastList){showList(lastList.items,lastList.title);return;}
  if(e.target.closest("#dImp")){const d=curDrawerItem;closeDrawer();openImpact(d);}
  if(e.target.closest("#dLnkEdit")){editLink=true;showDetail(curDrawerItem,lastBack);return;}
  if(e.target.closest("#dLnkDel")){saveLink(curDrawerItem,"");return;}
  if(e.target.closest("#dLnkSave")){
    const u=$("dLnkIn").value.trim();
    if(u&&!/^https?:/i.test(u)){toast("El link tiene que empezar con http o https");return;}
    saveLink(curDrawerItem,u);
  }
};
$("dClose").onclick=closeDrawer;$("dBg").onclick=closeDrawer;
$("bPdf").onclick=()=>window.print();
$("bPres").onclick=togglePres;
$("bTheme").onclick=()=>{setTheme(root.dataset.theme==="dark"?"light":"dark");saveHash();};
$("bZm").onclick=()=>setZoom((parseFloat(root.style.zoom)||.85)-.05);
$("bZp").onclick=()=>setZoom((parseFloat(root.style.zoom)||.85)+.05);
const SHARE_URL=["https:","","script.google.com","a","macros","despegar.com","s","AKfycbzM_hsgCInRJwjVRDAPsKhfhlQjXEKWpbvgEB5HtEd7yv3VKjERUCUY4ZKasUEd9ARUzw","exec"].join("/");   // armada por partes: Apps Script rompe la página si la URL va completa
// link fijo de la web app (dentro de Apps Script location.href no sirve); con ?i= abre directo el impacto de una iniciativa
const impLink=d=>SHARE_URL+"?i="+encodeURIComponent(d.name+"|"+d.date);
function copyLink(u){
  const fb=()=>{const t=document.createElement("textarea");t.value=u;document.body.appendChild(t);t.select();try{document.execCommand("copy");toast("🔗 Link copiado");}catch(e){toast("No se pudo copiar el link");}t.remove();};
  (navigator.clipboard?navigator.clipboard.writeText(u).then(()=>toast("🔗 Link copiado")):Promise.reject()).catch(fb);
}
$("bLink").onclick=()=>copyLink($("p-impacto").classList.contains("active")&&curImpact?impLink(curImpact):SHARE_URL);
// abre directo el impacto si el link trae ?i= (Code.gs lo pasa como window.OPEN_IMPACT)
const _open=window.OPEN_IMPACT||new URLSearchParams(location.search).get("i");
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(document.body.classList.contains("dopen"))closeDrawer();else if(root.classList.contains("pres"))togglePres();return;}
  if(view==="list"||!$("p-lista").classList.contains("active")||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const n=e.key==="ArrowLeft"?-1:e.key==="ArrowRight"?1:0;if(n)step(n);
});
$("clearAll").onclick=()=>{
  Object.assign(F,{q:"",imp:false});
  $("q").value="";$("fImp").checked=false;
  document.querySelectorAll(".ms-search input").forEach(i=>{i.value="";i.dispatchEvent(new Event("input"));});
  ["country","year"].forEach(f=>MS[f]([]));
  render();
};
setZoom(+(store.get("zoom")||.85));
loadHash();
render();
if(_open){const d=DATA.find(x=>x.name+"|"+x.date===_open&&hasImp(x));if(d)openImpact(d);}
</script>
</body>
</html>
