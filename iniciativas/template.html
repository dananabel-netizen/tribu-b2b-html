    </div>
    </section><section class="imp-sec" id="isec2"><div class="sec-h"><span class="sec-n">2</span><div><h3>Evolución</h3><p>GB y reservas con HDO pay a lo largo del tiempo</p></div></div>
    <div class="card"><div class="card-hdr"><div><div class="card-title">GB con HDO pay por período</div><div class="card-sub">GB confirmado en USD de reservas con wallet combinado con otro medio · AR, CL, CO, MX, BR y PE · desde 2 meses antes de la primera prendida</div></div>
      <div class="gran impGran"><button data-g="d">Día</button><button data-g="w">Semana</button><button data-g="m">Mes</button></div></div>
      <div class="ch"><canvas id="cHdoV"></canvas></div></div>
        </section><section class="imp-sec" id="isec3"><div class="sec-h"><span class="sec-n">3</span><div><h3>Con qué se combina</h3><p>¿Qué medio completa el pago cuando el saldo no alcanza?</p></div></div>
    <div class="card"><div class="card-hdr"><div><div class="card-title">Medio que acompaña a HDO pay</div><div class="card-sub" id="hpSub"></div></div>
      <div class="gran" id="hpCty"><button data-c="ALL">Todos</button>${C.map(r=>`<button data-c="${r[0]}" title="${CN[r[0]]||r[0]}">${flag(r[0])}</button>`).join("")}</div></div>
      <div style="display:grid;grid-template-columns:5fr 6fr;gap:14px;align-items:stretch">
        <div><table class="stbl"><thead><tr><th>Medio (procesador)</th><th class="num">Reservas</th><th class="num">GB (USD)</th><th class="num">% de reservas</th></tr></thead><tbody id="hpTb"></tbody></table></div>
        <div class="ch" style="height:280px"><canvas id="cHdoP"></canvas></div></div>
      <details class="meth"><summary>Cómo se calcula</summary><div class="card-sub" style="margin-top:6px">Cada reserva con HDO pay se cuenta una vez por cada medio que acompaña al wallet (si usó dos medios además del wallet, figura en ambos), por eso los porcentajes pueden sumar más de 100%. El medio es el procesador del cobro (ej. Rede y Getnet en BR, Mitec en MX, Paymentez y PayU en CO y PE, Transbank en CL, Itaú PIX en BR).</div></details></div>
    </section>
    <div class="card-sub" style="margin:6px 4px">HDO pay = reserva cobrada con 2 o más medios en la que uno es el wallet de HotelDO. El total son todas las reservas confirmadas del canal HTML (todos los productos). Se excluyen agencias con "test" en el nombre.</div>`;
  $("impBack").onclick=()=>setPage("lista");
  $("impact").querySelectorAll(".sec-nav a").forEach(a=>a.onclick=()=>$(a.dataset.t).scrollIntoView({behavior:"smooth",block:"start"}));
  const keyOf=(dd,g)=>g==="d"?dd:g==="w"?iso(mondayOf(new Date(dd+"T00:00:00Z"))):dd.slice(0,7);
  const lblOf=(k,g)=>g==="d"?fdate(k):g==="w"?"Sem "+fdate(k):MONTHS_L[+k.slice(5)-1]+" "+k.slice(2,4);
  const XT={d:"Día",w:"Semana (inicia el lunes)",m:"Mes"};
  const grid={color:"rgba(100,116,139,.15)",borderDash:[4,4]};
  const tt={backgroundColor:"#0F1834",padding:10,cornerRadius:8};
  function draw(){
    const m=new Map();
    cfg.daily.forEach(r=>{const k=keyOf(r[0],impGran);const a=m.get(k)||[0,0,0,0];a[0]+=r[2];a[1]+=r[3];a[2]+=r[4];a[3]+=r[5];m.set(k,a);});
    const ks=[...m.keys()].sort(), lb=ks.map(k=>lblOf(k,impGran));
    document.querySelectorAll(".impGran").forEach(g=>[...g.children].forEach(b=>b.classList.toggle("active",b.dataset.g===impGran)));
    const sh=ks.map(k=>m.get(k)[3]?Math.round(m.get(k)[1]/m.get(k)[3]*10000)/100:0);
    const cut=keyOf(C.map(r=>r[1]).sort()[0],impGran),on=i=>ks[i]>=cut;
    chart("cHdoS",{type:"line",data:{labels:lb,datasets:[{data:sh,borderColor:"#ED8B08",borderWidth:3,tension:.35,fill:true,segment:{borderColor:c=>on(c.p1DataIndex)?"#ED8B08":"#94A3B8"},
        backgroundColor:c=>{const a=c.chart.chartArea;if(!a)return "rgba(237,139,8,.15)";const g=c.chart.ctx.createLinearGradient(0,a.top,0,a.bottom);g.addColorStop(0,"rgba(237,139,8,.30)");g.addColorStop(1,"rgba(237,139,8,0)");return g;},
        pointRadius:impGran==="d"?3:6,pointHoverRadius:7,pointBackgroundColor:"#fff",pointBorderColor:ks.map((k,i)=>on(i)?"#ED8B08":"#94A3B8"),pointBorderWidth:2}]},
      options:{...baseOpts,plugins:{legend:{display:false},
        tooltip:{...tt,displayColors:false,callbacks:{label:c=>"Share: "+pf(c.parsed.y),afterLabel:c=>"USD "+fmtN(m.get(ks[c.dataIndex])[1])+" de USD "+fmtN(m.get(ks[c.dataIndex])[3])}},
        vlabels:{on:true,size:impGran==="d"?9:11,zero:false,fmt:pf}},
        scales:{y:{beginAtZero:true,grace:"30%",grid,ticks:{callback:v=>v+"%"},title:{display:true,text:"% del GB",color:"#64748B",font:{size:11,weight:"600"}}},
                x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true},title:{display:true,text:XT[impGran],color:"#64748B",font:{size:11,weight:"600"}}}}}});
    chart("cHdoV",{type:"bar",data:{labels:lb,datasets:[{label:"GB con HDO pay",data:ks.map(k=>Math.round(m.get(k)[1])),backgroundColor:"#ED8B08",borderRadius:{topLeft:6,topRight:6},maxBarThickness:64}]},
      options:{...baseOpts,plugins:{legend:{display:false},
        tooltip:{...tt,displayColors:false,callbacks:{label:c=>"GB con HDO pay: USD "+fmtN(c.parsed.y),afterLabel:c=>fmtN(m.get(ks[c.dataIndex])[0])+" reservas"}},
        vlabels:{on:true,size:impGran==="d"?9:11,zero:false,fmt:v=>"USD "+fmtN(v)}},
        scales:{y:{beginAtZero:true,grace:"18%",grid,title:{display:true,text:"GB (USD)",color:"#64748B",font:{size:11,weight:"600"}}},
                x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true},title:{display:true,text:XT[impGran],color:"#64748B",font:{size:11,weight:"600"}}}}}});
  }
  document.querySelectorAll(".impGran").forEach(el=>el.onclick=e=>{const g=e.target.dataset.g;if(!g)return;impGran=g;draw();});
  draw();
  const PN={ITAU_PIX:"PIX (Itaú)",REDE:"Rede",MITEC:"Mitec",PYMZ:"Paymentez",PAYMENTEZ:"Paymentez",PAYU:"PayU",TRB:"Transbank",KUSHKI:"Kushki",GET_BR:"Getnet",NUPAY:"Nupay",AZD:"AZD",CIE:"CIE",LAT:"LAT",GDS:"GDS",INFINIA:"Infinia",NLA:"NLA"};
  let hpC="ALL";
  function drawHp(){
    const m=new Map();let nres=0;
    (cfg.partners||[]).forEach(([c,pa,n,gb])=>{if(hpC!=="ALL"&&c!==hpC)return;nres+=n;
      pa.split("+").filter(Boolean).forEach(ch=>{const k=PN[ch]||ch;const a=m.get(k)||[0,0];a[0]+=n;a[1]+=gb;m.set(k,a);});});
    const list=[...m.entries()].sort((a,b)=>b[1][0]-a[1][0]);
    $("hpTb").innerHTML=list.map(([k,v])=>`<tr><td>${k}</td><td class="num">${fmtN(v[0])}</td><td class="num">${fmtN(v[1])}</td><td class="num">${nres?(v[0]/nres*100).toFixed(0)+"%":"-"}</td></tr>`).join("")||'<tr><td colspan="4" class="dt">Sin reservas con HDO pay en este país</td></tr>';
    $("hpSub").textContent=nres+" reservas con HDO pay"+(hpC==="ALL"?" · todos los países":" · "+(CN[hpC]||hpC))+" · desde la prendida";
    document.querySelectorAll("#hpCty button").forEach(b=>b.classList.toggle("active",b.dataset.c===hpC));
    const top=list.slice(0,8);
    chart("cHdoP",{type:"bar",data:{labels:top.map(x=>x[0]),datasets:[{data:top.map(x=>x[1][0]),backgroundColor:"#ED8B08",borderRadius:6,maxBarThickness:26}]},
      options:{...baseOpts,indexAxis:"y",plugins:{legend:{display:false},tooltip:{...tt,displayColors:false,callbacks:{label:c=>fmtN(c.parsed.x)+" reservas"}},vlabels:{on:true,size:11,fmt:v=>fmtN(v)}},
        scales:{x:{beginAtZero:true,grace:"12%",grid,title:{display:true,text:"Reservas",color:"#64748B",font:{size:11,weight:"600"}}},y:{grid:{display:false}}}}});
  }
  $("hpCty").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;hpC=b.dataset.c;drawHp();};
  drawHp();
}

function render(){
  if($("p-impacto").classList.contains("active")){renderImpact();return;}
  const rows=DATA.filter(match);
  $("fcount").textContent=`${rows.length} de ${DATA.length} iniciativas`;
  $("chipTotal").textContent=`📋 ${DATA.length} iniciativas`;
  const dates=DATA.map(d=>d.date).sort();
  const f=s=>`${MONTHS[+s.slice(5,7)-1]} ${s.slice(0,4)}`;
  $("chipRange").textContent=`📅 ${f(dates[0])} - ${f(dates[dates.length-1])}`;
  renderList(rows);saveHash();
}

/* ---------- eventos ---------- */
$("q").oninput=e=>{F.q=e.target.value;render();};
$("fImp").onchange=e=>{F.imp=e.target.checked;render();};
$("tabs").onclick=e=>{const p=e.target.dataset.p;if(!p)return;setPage(p);};
/* ---------- navegación, herramientas, link compartible ---------- */
const root=document.documentElement;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function setZoom(z){const v=Math.min(1.3,Math.max(.6,Math.round(z*100)/100));root.style.zoom=v;store.set("zoom",v);}
function setTheme(t){root.dataset.theme=t;$("bTheme").textContent=t==="dark"?"☀️":"🌙";store.set("theme",t);}
function togglePres(){root.classList.toggle("pres");$("bPres").textContent=root.classList.contains("pres")?"✕ Salir":"🖥 Presentar";}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200);}

function saveHash(){
  try{
    const p=new URLSearchParams();
    p.set("v",view);p.set("y",calY);p.set("m",calM+1);
    if(view==="week")p.set("w",iso(weekStart));
    if(F.country.length)p.set("c",F.country.join(","));
    if(F.year.length)p.set("a",F.year.join(","));
    if(F.q)p.set("q",F.q);
    if(F.imp)p.set("imp","1");
    if(view==="list"){p.set("s",sortBy);p.set("g",groupBy);}
    if(root.dataset.theme==="dark")p.set("th","d");
    history.replaceState(null,"","#"+p.toString());
  }catch(e){}
}
function loadHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  if(["cal","week","year","list"].includes(p.get("v")))view=p.get("v");
  if(+p.get("y")>2000)calY=+p.get("y");
  if(+p.get("m")>=1&&+p.get("m")<=12)calM=+p.get("m")-1;
  if(/^\d{4}-\d\d-\d\d$/.test(p.get("w")||""))weekStart=mondayOf(new Date(p.get("w")+"T00:00:00Z"));
  if(p.get("c"))MS.country(p.get("c").split(","));
  if(p.get("a"))MS.year(p.get("a").split(","));
  if(p.get("q")){F.q=p.get("q");$("q").value=F.q;}
  if(p.get("imp")==="1"){F.imp=true;$("fImp").checked=true;}
  if(cmpMap[p.get("s")]){sortBy=p.get("s");}
  if(["month","year","cat","none"].includes(p.get("g")))groupBy=p.get("g");
  $("sortSel").value=sortBy;$("grpSel").value=groupBy;
  setTheme(p.get("th")==="d"?"dark":(store.get("theme")||"light"));
}
function step(n){
  if(n===0){calAll=false;calY=NOWY;calM=NOWM;weekStart=mondayOf(NOW);}
  else if(view==="week"){weekStart=new Date(weekStart.getTime()+n*7*864e5);calY=weekStart.getUTCFullYear();calM=weekStart.getUTCMonth();}
  else{calAll=false;calY=Math.max(MINY,calY+n);}
  render();
}

$("cal").onclick=e=>{
  const yb=e.target.closest(".cal-yt [data-y]");
  if(yb){calAll=yb.dataset.y==="all";if(!calAll)calY=+yb.dataset.y;render();return;}
  const mi=e.target.closest(".mc-b");
  if(mi){openDrawer([DATA[+mi.dataset.i]]);return;}
  const mc=e.target.closest(".mc-h.has,.mc-m");
  if(mc){const yy=+mc.dataset.yy,mm=+mc.dataset.mm;openDrawer(DATA.filter(d=>match(d)&&d.y===yy&&d.m===mm),MONTHS_L[mm]+" "+yy);return;}
  const c=e.target.closest(".chip-i,.wk-card");
  if(c){openDrawer([DATA[+c.dataset.i]]);return;}
  const m=e.target.closest(".more,.cal-d.has");
  if(m){openDrawer(DATA.filter(d=>d.date===m.dataset.day&&match(d)),longDate(m.dataset.day));return;}
  const y=e.target.closest(".yr-c.has");
  if(y){const k=y.dataset.k,mm=+y.dataset.mm;openDrawer(DATA.filter(d=>match(d)&&d.y===calY&&d.m===mm&&d.cat===k),`${k} · ${MONTHS_L[mm]} ${calY}`);}
};
$("list").onclick=e=>{const a=e.target.closest(".item");if(a)openDrawer([DATA[+a.dataset.i]]);};
$("calNav").onclick=e=>{const b=e.target.closest("[data-n]");if(b)step(+b.dataset.n);};
$("vSeg").onclick=e=>{
  const b=e.target.closest("[data-v]");if(!b)return;const v=b.dataset.v;
  if(v==="week"&&view!=="week")weekStart=mondayOf((calY===NOWY&&calM===NOWM)?NOW:new Date(Date.UTC(calY,calM,1)));
  view=v;render();
};
$("sortSel").onchange=e=>{sortBy=e.target.value;render();};
$("grpSel").onchange=e=>{groupBy=e.target.value;render();};
$("dBody").onclick=e=>{
  const it=e.target.closest(".d-item");if(it){showDetail(DATA[+it.dataset.i],true);return;}
  if(e.target.closest("#dBackL")&&lastList){showList(lastList.items,lastList.title);return;}
  if(e.target.closest("#dImp")){const d=curDrawerItem;closeDrawer();openImpact(d);}
  if(e.target.closest("#dLnkEdit")){editLink=true;showDetail(curDrawerItem,lastBack);return;}
  if(e.target.closest("#dLnkDel")){saveLink(curDrawerItem,"");return;}
  if(e.target.closest("#dLnkSave")){
    const u=$("dLnkIn").value.trim();
    if(u&&!/^https?:/i.test(u)){toast("El link tiene que empezar con http o https");return;}
    saveLink(curDrawerItem,u);
  }
};
$("dClose").onclick=closeDrawer;$("dBg").onclick=closeDrawer;
$("bPdf").onclick=()=>window.print();
$("bPres").onclick=togglePres;
$("bTheme").onclick=()=>{setTheme(root.dataset.theme==="dark"?"light":"dark");saveHash();};
$("bZm").onclick=()=>setZoom((parseFloat(root.style.zoom)||.85)-.05);
$("bZp").onclick=()=>setZoom((parseFloat(root.style.zoom)||.85)+.05);
const SHARE_URL=["https:","","script.google.com","a","macros","despegar.com","s","AKfycbzM_hsgCInRJwjVRDAPsKhfhlQjXEKWpbvgEB5HtEd7yv3VKjERUCUY4ZKasUEd9ARUzw","exec"].join("/");   // armada por partes: Apps Script rompe la página si la URL va completa
// link fijo de la web app (dentro de Apps Script location.href no sirve); con ?i= abre directo el impacto de una iniciativa
const impLink=d=>SHARE_URL+"?i="+encodeURIComponent(d.name+"|"+d.date);
function copyLink(u){
  const fb=()=>{const t=document.createElement("textarea");t.value=u;document.body.appendChild(t);t.select();try{document.execCommand("copy");toast("🔗 Link copiado");}catch(e){toast("No se pudo copiar el link");}t.remove();};
  (navigator.clipboard?navigator.clipboard.writeText(u).then(()=>toast("🔗 Link copiado")):Promise.reject()).catch(fb);
}
$("bLink").onclick=()=>copyLink($("p-impacto").classList.contains("active")&&curImpact?impLink(curImpact):SHARE_URL);
// abre directo el impacto si el link trae ?i= (Code.gs lo pasa como window.OPEN_IMPACT)
const _open=window.OPEN_IMPACT||new URLSearchParams(location.search).get("i");
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(document.body.classList.contains("dopen"))closeDrawer();else if(root.classList.contains("pres"))togglePres();return;}
  if(view==="list"||!$("p-lista").classList.contains("active")||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const n=e.key==="ArrowLeft"?-1:e.key==="ArrowRight"?1:0;if(n)step(n);
});
$("clearAll").onclick=()=>{
  Object.assign(F,{q:"",imp:false});
  $("q").value="";$("fImp").checked=false;
  document.querySelectorAll(".ms-search input").forEach(i=>{i.value="";i.dispatchEvent(new Event("input"));});
  ["country","year"].forEach(f=>MS[f]([]));
  render();
};
setZoom(+(store.get("zoom")||.85));
loadHash();
render();
if(_open){const d=DATA.find(x=>x.name+"|"+x.date===_open&&hasImp(x));if(d)openImpact(d);}
</script>
</body>
