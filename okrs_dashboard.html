<!DOCTYPE html>
<!-- v3 -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero Producto B2B - HTML · H1 FY27</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--surface2:#f8f9fa;--border:#e8e0f0;--border2:#d5c8e8;--purple:#6D28D9;--text:#1f2328;--muted:#57606a;--radius:8px;--shadow:0 1px 4px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
header{background:linear-gradient(90deg,#5B21B6,#7C3AED);padding:0 28px;height:72px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;box-shadow:0 2px 12px rgba(91,33,182,.4)}
.logo-main{color:#fff;font-size:15px;font-weight:700}.logo-main span{color:#C4B5FD}
.logo-sub{color:rgba(196,181,253,.65);font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.upd{color:rgba(255,255,255,.5);font-size:11px}
.filter-bar{display:flex;gap:24px;padding:14px 28px;background:#fff;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;position:sticky;top:72px;z-index:200;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.filter-group{display:flex;align-items:center;gap:8px}
.filter-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pill{padding:5px 16px;border-radius:20px;border:1.5px solid var(--border2);background:#fff;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;line-height:1.4}
.pill:hover{border-color:var(--purple);color:var(--purple)}
.pill.active{background:var(--purple);border-color:var(--purple);color:#fff}
main{padding:28px;max-width:1200px;margin:0 auto}
.sec-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--border);margin-top:28px}
.sec-title:first-child{margin-top:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto;margin-bottom:8px}
.card-hdr{background:#5457D9;color:#fff;padding:14px 20px;font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#7C7FFF;color:#fff;padding:10px 8px;text-align:center;font-weight:700;font-size:11px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.15)}
th.th-kr{text-align:left;padding-left:16px;width:340px}
th.th-q{background:#5457D9;border-left:2px solid rgba(255,255,255,.25)}
td{padding:11px 8px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
td.td-kr{text-align:left;padding-left:16px;font-weight:500}
td.td-q{border-left:2px solid var(--border2);font-weight:700}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:none}
.chip{display:inline-block;padding:4px 10px;border-radius:5px;font-size:12px;font-weight:700;min-width:44px;text-align:center}
.ok{background:#d4f4dd;color:#16a34a}.warn{background:#fff7cd;color:#b45309}.bad{background:#ffd8d3;color:#cf222e}.na{background:#f0f0f0;color:#999;font-size:11px;font-weight:400}
footer{text-align:center;padding:20px;font-size:11px;color:var(--muted)}
body.dark{--bg:#0f172a;--surface:#1e293b;--surface2:#162032;--border:#334155;--border2:#475569;--text:#e2e8f0;--muted:#94a3b8;--purple:#A78BFA}
body.dark .ok{background:#14532d;color:#86efac}body.dark .warn{background:#713f12;color:#fde68a}body.dark .bad{background:#7f1d1d;color:#fca5a5}body.dark .na{background:#1e293b;color:#64748b}
body.dark .filter-bar{background:var(--surface)}
body.dark .pill{background:var(--surface2);color:var(--muted);border-color:var(--border2)}
body.dark .pill.active{background:var(--purple);border-color:var(--purple);color:#fff}
body.dark tbody tr:hover{background:#1e3a5f22}
body,main,.card,.filter-bar{transition:background .25s,border-color .25s,color .25s}
#theme-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:5px 10px;font-size:15px;cursor:pointer;line-height:1;transition:background .2s}
#theme-btn:hover{background:rgba(255,255,255,.25)}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <div>
    <div class="logo-main">Tablero Producto B2B <span>HTML</span></div>
    <div class="logo-sub">H1 FY27 · Abril — Septiembre 2026</div>
  </div>
  <div style="display:flex;align-items:center;gap:14px">
    <span class="upd">Actualizado: 2026-07-31 11:58</span>
    <button id="theme-btn" onclick="toggleTheme()" title="Modo noche/día">🌙</button>
  </div>
</header>
<div class="filter-bar">
  <div class="filter-group" id="sq-filter" style="display:none">
    <span class="filter-label">Squad</span>
    <button class="pill sqpill active" onclick="setSquad('all',this)">Todos</button>
    <button class="pill sqpill" onclick="setSquad('api',this)">API</button>
    <button class="pill sqpill" onclick="setSquad('commercial',this)">Commercial & Engagement</button>
    <button class="pill sqpill" onclick="setSquad('efficiency',this)">Efficiency & Support</button>
    <button class="pill sqpill" onclick="setSquad('rewards',this)">Rewards B2B2C</button>
  </div>
  <div class="filter-group" id="type-filter">
    <span class="filter-label">Vista</span>
    <button class="pill typepill active" onclick="setType('all',this)">Todos</button>
    <button class="pill typepill" onclick="setType('okr',this)">OKRs</button>
    <button class="pill typepill" onclick="setType('initiative',this)">Iniciativas</button>
  </div>
</div>
<main>
<section class="sec-title">Resumen ejecutivo</section>
<div class="card"><div class="card-hdr">Evolución semanal de los OKRs</div><div style="padding:20px"><canvas id="okrChart" height="90"></canvas></div></div>
<section class="sec-title">Objectives & Key Results</section>
<div id="okr-container"></div>
<section class="sec-title">Iniciativas estratégicas</section>
<div id="initiative-container"></div>
</main>
<footer>HotelDO B2B · Producto · H1 FY27 · Datos de seguimiento interno</footer>
<script>
const squads={
 api:{name:'API',color:'#6D28D9',objectives:[{title:'Escalar la venta de hoteles vía API',krs:[['Revenue neto Hotel vía API','Meta: $X M','En seguimiento'],['Tasa de error de integración','Meta: < 1%','En seguimiento'],['Tiempo de integración de nuevos partners','Meta: -20%','En seguimiento']]}]},
 commercial:{name:'Commercial & Engagement',color:'#2563EB',objectives:[{title:'Aumentar la activación y monetización de agencias',krs:[['Revenue neto White Label','Meta: $X M','En seguimiento'],['Revenue neto HotelDO','Meta: $X M','En seguimiento'],['Agencias activas','Meta: +15%','En seguimiento']]}]},
 efficiency:{name:'Efficiency & Support',color:'#059669',objectives:[{title:'Mejorar la eficiencia operativa y retención',krs:[['Revenue neto HotelDO','Meta: $X M','En seguimiento'],['Retención de agencias','Meta: +10pp','En seguimiento'],['Resolución autoservicio','Meta: +25%','En seguimiento']]}]},
 rewards:{name:'Rewards B2B2C',color:'#EA580C',objectives:[{title:'Impulsar Rewards B2B2C con seguridad y compliance',krs:[['Adopción de Rewards','Meta: +20%','En seguimiento'],['Cobertura de controles de seguridad','Meta: 100%','En seguimiento'],['Hallazgos de compliance abiertos','Meta: 0','En seguimiento']}]}
};
const weekLabels=['Semana 1 (1–7 abr)','Semana 2 (8–14 abr)','Semana 3 (15–21 abr)','Semana 4 (22–30 abr)','Semana 5 (1–7 may)','Semana 6 (8–14 may)','Semana 7 (15–21 may)','Semana 8 (22–31 may)','Semana 9 (1–7 jun)','Semana 10 (8–14 jun)','Semana 11 (15–21 jun)','Semana 12 (22–30 jun)','Semana 13 (1–7 jul)','Semana 14 (8–14 jul)','Semana 15 (15–21 jul)','Semana 16 (22–31 jul)'];
const chartData={api:[65,66,68,69,70,71,72,74,75,76,76,78,79,80,82,83],commercial:[48,50,51,52,54,55,57,58,60,61,62,64,65,66,68,70],efficiency:[55,56,57,57,59,60,61,62,63,64,66,67,68,69,70,72],rewards:[40,42,43,44,45,47,48,50,51,53,55,56,58,59,61,63]};
let currentSquad='all',currentType='all',chart;
function render(){
 const o=document.getElementById('okr-container'),i=document.getElementById('initiative-container');o.innerHTML='';i.innerHTML='';
 Object.entries(squads).filter(([key])=>currentSquad==='all'||key===currentSquad).forEach(([key,s])=>{
  if(currentType!=='initiative') s.objectives.forEach(obj=>{const card=document.createElement('div');card.className='card';card.dataset.squad=key;card.dataset.type='okr';card.innerHTML=`<div class="card-hdr" style="background:${s.color}">${s.name} · ${obj.title}</div><table><thead><tr><th class="th-kr">Key Result</th><th>Meta</th><th>Estado actual</th><th>Semana 1</th><th>Semana 4</th><th>Semana 8</th><th>Semana 12</th><th class="th-q">Semana 16</th></tr></thead><tbody>${obj.krs.map((kr,n)=>`<tr><td class="td-kr">${kr[0]}</td><td>${kr[1]}</td><td><span class="chip ${n===0?'warn':'ok'}">${kr[2]}</span></td><td>${n===0?'—':'En curso'}</td><td>${n===0?'—':'En curso'}</td><td>${n===0?'—':'En curso'}</td><td>${n===0?'—':'En curso'}</td><td class="td-q">${n===0?'—':'En curso'}</td></tr>`).join('')}</tbody></table>`;o.appendChild(card)});
  if(currentType!=='okr'){const card=document.createElement('div');card.className='card';card.dataset.squad=key;card.dataset.type='initiative';card.innerHTML=`<div class="card-hdr" style="background:${s.color}">${s.name} · Iniciativas</div><table><thead><tr><th class="th-kr">Iniciativa</th><th>Owner</th><th>Estado</th><th>Impacto esperado</th></tr></thead><tbody><tr><td class="td-kr">Roadmap de mejora continua ${s.name}</td><td>Producto</td><td><span class="chip warn">En curso</span></td><td>Contribución al objetivo del squad</td></tr><tr><td class="td-kr">Instrumentación y seguimiento semanal</td><td>Data / Producto</td><td><span class="chip ok">Planificado</span></td><td>Visibilidad accionable</td></tr></tbody></table>`;i.appendChild(card)}
 });
 updateChart();
}
function updateChart(){if(chart)chart.destroy();const ctx=document.getElementById('okrChart').getContext('2d');const selected=currentSquad==='all'?Object.keys(squads):[currentSquad];chart=new Chart(ctx,{type:'line',data:{labels:weekLabels,datasets:selected.map(k=>({label:squads[k].name,data:chartData[k],borderColor:squads[k].color,backgroundColor:squads[k].color+'22',tension:.25,fill:true,pointRadius:2}))},options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}},x:{ticks:{maxRotation:45,minRotation:45,maxTicksLimit:8}}}}});}
function setSquad(v,el){currentSquad=v;document.querySelectorAll('.sqpill').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function setType(v,el){currentType=v;document.querySelectorAll('.typepill').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function toggleTheme(){document.body.classList.toggle('dark');document.getElementById('theme-btn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';}
render();
</script>
</body>
</html>
