<!DOCTYPE html>
<!-- v3 -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero Producto B2B - HTML · H1 FY27</title>
<style>
:root{--violet:#3F1B6B;--violet-l:#5D2DA0;--violet-l2:#8E5DD3;--violet-bg:#F3EDFB;--violet-bg2:#E8DEF8;--bg:#FAFAFB;--card:#FFF;--text:#1A1A2E;--text-s:#5C5C6F;--green:#1A936F;--green-bg:#E0F5EF;--red:#C0392B;--red-bg:#FDEAEA;--yellow:#E6A817;--yellow-bg:#FEF6E4;--border:#E5E5EC;--radius:14px;--shadow:0 2px 12px rgba(60,27,107,.08);--mono:'SF Mono','Fira Code','Courier New',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.container{max-width:1280px;margin:0 auto;padding:24px 16px}
header{text-align:center;margin-bottom:28px}
header h1{color:var(--violet);font-size:1.6rem;font-weight:700}
header .sub{color:var(--text-s);font-size:.85rem;margin-top:4px}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--violet);margin-bottom:24px;flex-wrap:wrap}
.tab{padding:10px 20px;background:none;border:none;cursor:pointer;font-size:.9rem;font-weight:500;color:var(--text-s);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab:hover{color:var(--violet)}
.tab.active{color:var(--violet);border-bottom-color:var(--violet);font-weight:600}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px;border:1px solid var(--border)}
.card h3{color:var(--violet);font-size:1rem;font-weight:600;margin-bottom:12px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px}
.kpi{background:var(--card);border-radius:var(--radius);padding:16px 18px;border:1px solid var(--border);box-shadow:var(--shadow)}
.kpi .label{font-size:.75rem;color:var(--text-s);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.kpi .value{font-size:1.5rem;font-weight:700;color:var(--text);margin:4px 0 2px}
.kpi .target{font-size:.75rem;color:var(--text-s)}
.kpi .delta{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:6px;font-weight:600}
.delta.pos{background:var(--green-bg);color:var(--green)}
.delta.neg{background:var(--red-bg);color:var(--red)}
.delta.neu{background:var(--yellow-bg);color:var(--yellow)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--violet);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.3px;background:var(--violet-bg);position:sticky;top:0}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
tr:hover td{background:var(--violet-bg)}
.chart-wrap{position:relative;height:280px;margin:12px 0}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{width:70px;font-size:.78rem;color:var(--text-s);text-align:right;flex-shrink:0}
.bar-track{flex:1;height:24px;background:var(--violet-bg);border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;transition:width .4s;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:.72rem;font-weight:600;color:#fff}
.bar-fill.violet{background:linear-gradient(90deg,var(--violet),var(--violet-l))}
.bar-fill.green{background:linear-gradient(90deg,#1A936F,#2DB98A)}
.bar-fill.red{background:linear-gradient(90deg,#C0392B,#E55A4A)}
.bar-fill.yellow{background:linear-gradient(90deg,#E6A817,#F0BC3A)}
.filter-bar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filter-bar select,.filter-bar input{padding:6px 12px;border:1px solid var(--border);border-radius:8px;font-size:.82rem;background:var(--card);color:var(--text)}
.filter-bar label{font-size:.78rem;color:var(--text-s);font-weight:500}
.section-title{color:var(--violet);font-size:1.05rem;font-weight:600;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.progress-ring{display:inline-flex;align-items:center;gap:12px}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring .ring-bg{stroke:var(--violet-bg)}
.progress-ring .ring-fg{stroke:var(--violet-l);stroke-linecap:round;transition:stroke-dashoffset .5s}
.progress-ring .ring-text{font-size:1.1rem;font-weight:700;color:var(--violet)}
.note{font-size:.72rem;color:var(--text-s);margin-top:6px;font-style:italic}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.68rem;font-weight:600}
.badge.pos{background:var(--green-bg);color:var(--green)}
.badge.neg{background:var(--red-bg);color:var(--red)}
.badge.neu{background:var(--yellow-bg);color:var(--yellow)}
.updated-bar{text-align:center;font-size:.72rem;color:var(--text-s);margin-bottom:16px;padding:6px;background:var(--violet-bg);border-radius:8px}
.scroll-x{overflow-x:auto}
.week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.week-cell{background:var(--violet-bg);border-radius:8px;padding:10px;text-align:center}
.week-cell .wk{font-size:.68rem;color:var(--text-s)}
.week-cell .val{font-size:1.1rem;font-weight:700;color:var(--violet)}
.week-cell .tgt{font-size:.68rem;color:var(--text-s)}
@media(max-width:768px){.kpi-row{grid-template-columns:1fr 1fr}.bar-label{width:50px}}
</style>
</head>
