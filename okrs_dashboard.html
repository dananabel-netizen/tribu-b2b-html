<!DOCTYPE html>
<!-- v3 -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero Producto B2B - HTML · H1 FY27</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--surface2:#f8f9fa;--border:#e8e0f0;--border2:#d5c8e8;--purple:#6D28D9;--text:#1f2328;--muted:#57606a;--radius:8px;--shadow:0 1px 4px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
header{background:linear-gradient(90deg,#5B21B6,#7C3AED);padding:0 28px;height:72px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;box-shadow:0 2px 12px rgba(91,33,182,.4)}
.logo-main{color:#fff;font-size:15px;font-weight:700}.logo-main span{color:#C4B5FD}
.logo-sub{color:rgba(196,181,253,.65);font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.upd{color:rgba(255,255,255,.5);font-size:11px}
.filter-bar{display:flex;gap:24px;padding:14px 28px;background:#fff;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;position:sticky;top:72px;z-index:200;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.filter-group{display:flex;align-items:center;gap:8px}
.filter-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pill{padding:5px 16px;border-radius:20px;border:1.5px solid var(--border2);background:#fff;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;line-height:1.4}
.pill:hover{border-color:var(--purple);color:var(--purple)}
.pill.active{background:var(--purple);border-color:var(--purple);color:#fff}
main{padding:28px;max-width:1200px;margin:0 auto}
.sec-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--border);margin-top:28px}
.sec-title:first-child{margin-top:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto;margin-bottom:8px}
.card-hdr{background:#5457D9;color:#fff;padding:14px 20px;font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#7C7FFF;color:#fff;padding:10px 8px;text-align:center;font-weight:700;font-size:11px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.15)}
th.th-kr{text-align:left;padding-left:16px;width:340px}
th.th-q{background:#5457D9;border-left:2px solid rgba(255,255,255,.25)}
td{padding:11px 8px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
td.td-kr{text-align:left;padding-left:16px;font-weight:500}
td.td-q{border-left:2px solid var(--border2);font-weight:700}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:none}
.chip{display:inline-block;padding:4px 10px;border-radius:5px;font-size:12px;font-weight:700;min-width:44px;text-align:center}
.ok{background:#d4f4dd;color:#16a34a}.warn{background:#fff7cd;color:#b45309}.bad{background:#ffd8d3;color:#cf222e}.na{background:#f0f0f0;color:#999;font-size:11px;font-weight:400}
footer{text-align:center;padding:20px;font-size:11px;color:var(--muted)}
body.dark{--bg:#0f172a;--surface:#1e293b;--surface2:#162032;--border:#334155;--border2:#475569;--text:#e2e8f0;--muted:#94a3b8;--purple:#A78BFA}
body.dark .ok{background:#14532d;color:#86efac}body.dark .warn{background:#713f12;color:#fde68a}body.dark .bad{background:#7f1d1d;color:#fca5a5}body.dark .na{background:#1e293b;color:#64748b}
body.dark .filter-bar{background:var(--surface)}
body.dark .pill{background:var(--surface2);color:var(--muted);border-color:var(--border2)}
body.dark .pill.active{background:var(--purple);border-color:var(--purple);color:#fff}
body.dark tbody tr:hover{background:#1e3a5f22}
body,main,.card,.filter-bar{transition:background .25s,border-color .25s,color .25s}
#theme-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:5px 10px;font-size:15px;cursor:pointer;line-height:1;transition:background .2s}
#theme-btn:hover{background:rgba(255,255,255,.25)}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <div>
    <div class="logo-main">Tablero Producto B2B <span>HTML</span></div>
    <div class="logo-sub">H1 FY27 · Abril — Septiembre 2026</div>
  </div>
  <div style="display:flex;align-items:center;gap:14px">
    <span class="upd">Actualizado: 2026-07-31 10:12</span>
    <button id="theme-btn" onclick="toggleTheme()" title="Modo noche/día">🌙</button>
  </div>
</header>
<div class="filter-bar">
  <div class="filter-group" id="sq-filter" style="display:none">

    <button class="pill sqpill" onclick="setSq('es',this)">E&amp;S</button>

  <div class="filter-group" id="mes-filter" style="display:none">
    <span class="filter-label">Mes</span>
    <button class="pill mespill" data-mes="all" onclick="setPulsoMes('all',this)">Todos</button>
    <button class="pill mespill" data-mes="2026-04" onclick="setPulsoMes('2026-04',this)">Abr</button>
    <button class="pill mespill" data-mes="2026-05" onclick="setPulsoMes('2026-05',this)">May</button>
    <button class="pill mespill" data-mes="2026-06" onclick="setPulsoMes('2026-06',this)">Jun</button>
    <button class="pill mespill" data-mes="2026-07" onclick="setPulsoMes('2026-07',this)">Jul</button>
    <button class="pill mespill" data-mes="2026-08" onclick="setPulsoMes('2026-08',this)">Ago</button>
    <button class="pill mespill" data-mes="2026-09" onclick="setPulsoMes('2026-09',this)">Sep</button>
  </div>
  <div class="filter-group" style="margin-left:auto">
    <button class="pill tabpill active" onclick="setTab('mensual',this)">Mensual</button>
    <button class="pill tabpill" onclick="setTab('semanal',this)">Semanal</button>
    <button class="pill tabpill" onclick="setTab('progreso',this)">Progreso</button>
    <button class="pill tabpill" onclick="setTab('monitor',this)">Monitor</button>
  </div>
</div>
<main id="root"></main>
<footer>Datos del Datalake de Despegar (Trino)</footer>
<script>
var DATA = {"kr21": [{"mes_deadline": "2026-04-01", "total_reservas": 12739, "reservas_timeout_client": 2933, "pct_timeout_client": 23.0}, {"mes_deadline": "2026-05-01", "total_reservas": 14553, "reservas_timeout_client": 3662, "pct_timeout_client": 25.2}, {"mes_deadline": "2026-06-01", "total_reservas": 14219, "reservas_timeout_client": 3464, "pct_timeout_client": 24.4}, {"mes_deadline": "2026-07-01", "total_reservas": 15008, "reservas_timeout_client": 3603, "pct_timeout_client": 24.0}, {"mes_deadline": "2026-08-01", "total_reservas": 11924, "reservas_timeout_client": 0, "pct_timeout_client": 0.0}, {"mes_deadline": "2026-09-01", "total_reservas": 10426, "reservas_timeout_client": 2, "pct_timeout_client": 0.0}, {"mes_deadline": "2026-10-01", "total_reservas": 8316, "reservas_timeout_client": 0, "pct_timeout_client": 0.0}, {"mes_deadline": "2026-11-01", "total_reservas": 6529, "reservas_timeout_client": 1, "pct_timeout_client": 0.0}, {"mes_deadline": "2026-12-01", "total_reservas": 4345, "reservas_timeout_client": 0, "pct_timeout_client": 0.0}, {"mes_deadline": "2027-01-01", "total_reservas": 2001, "reservas_timeout_client": 1, "pct_timeout_client": 0.0}, {"mes_deadline": "2027-02-01", "total_reservas": 879, "reservas_timeout_client": 0, "pct_timeout_client": 0.0}, {"mes_deadline": "2027-03-01", "total_reservas": 814, "reservas_timeout_client": 0, "pct_timeout_client": 0.0}, {"mes_deadline": "2027-04-01", "total_reservas": 677, "reservas_timeout_client": 0, "pct_timeout_client": 0.0}, {"mes_deadline": "2027-05-01", "total_reservas": 447, "reservas_timeout_client": 0, "pct_timeout_client": 0.0}, {"mes_deadline": "2027-06-01", "total_reservas": 197, "reservas_timeout_client": 0, "pct_timeout_client": 0.0}, {"mes_deadline": "2027-07-01", "total_reservas": 53, "reservas_timeout_client": 0, "pct_timeout_client": 0.0}, {"mes_deadline": "2027-08-01", "total_reservas": 9, "reservas_timeout_client": 0, "pct_timeout_client": 0.0}, {"mes_deadline": "2027-09-01", "total_reservas": 1, "reservas_timeout_client": 0, "pct_timeout_client": 0.0}], "kr23": [{"mes_deadline": "2026-04-01", "reservas_con_herramientas": 0, "reservas_total": 3489, "pct_adopcion": 0.0}, {"mes_deadline": "2026-05-01", "reservas_con_herramientas": 0, "reservas_total": 10093, "pct_adopcion": 0.0}, {"mes_deadline": "2026-06-01", "reservas_con_herramientas": 0, "reservas_total": 9574, "pct_adopcion": 0.0}, {"mes_deadline": "2026-07-01", "reservas_con_herramientas": 0, "reservas_total": 9485, "pct_adopcion": 0.0}, {"mes_deadline": "2026-08-01", "reservas_con_herramientas": 0, "reservas_total": 0, "pct_adopcion": 0.0}, {"mes_deadline": "2026-09-01", "reservas_con_herramientas": 0, "reservas_total": 0, "pct_adopcion": 0.0}, {"mes_deadline": "2026-10-01", "reservas_con_herramientas": 0, "reservas_total": 0, "pct_adopcion": 0.0}, {"mes_deadline": "2026-11-01", "reservas_con_herramientas": 0, "reservas_total": 0, "pct_adopcion": 0.0}, {"mes_deadline": "2026-12-01", "reservas_con_herramientas": 0, "reservas_total": 0, "pct_adopcion": 0.0}, {"mes_deadline": "2027-01-01", "reservas_con_herramientas": 0, "reservas_total": 0, "pct_adopcion": 0.0}, {"mes_deadline": "2027-02-01", "reservas_con_herramientas": 0, "reservas_total": 0, "pct_adopcion": 0.0}, {"mes_deadline": "2027-03-01", "reservas_con_herramientas": 0, "reservas_total": 0, "pct_adopcion": 0.0}, {"mes_deadline": "2027-04-01", "reservas_con_herramientas": 0, "reservas_total": 0, "pct_adopcion": 0.0}, {"mes_deadline": "2027-05-01", "reservas_con_herramientas": 0, "reservas_total": 0, "pct_adopcion": 0.0}, {"mes_deadline": "2027-06-01", "reservas_con_herramientas": 0, "reservas_total": 0, "pct_adopcion": 0.0}, {"mes_deadline": "2027-07-01", "reservas_con_herramientas": 0, "reservas_total": 0, "pct_adopcion": 0.0}, {"mes_deadline": "2027-08-01", "reservas_con_herramientas": 0, "reservas_total": 0, "pct_adopcion": 0.0}, {"mes_deadline": "2027-09-01", "reservas_con_herramientas": 0, "reservas_total": 0, "pct_adopcion": 0.0}], "meses": ["2026-04", "2026-05", "2026-06", "2026-07", "2026-08", "2026-09"], "adopcion": [{"mes": "2026-04", "reservas_total": 3489, "reservas_con_herramientas": 0, "pct_adopcion": 0.0}, {"mes": "2026-05", "reservas_total": 10093, "reservas_con_herramientas": 0, "pct_adopcion": 0.0}, {"mes": "2026-06", "reservas_total": 9574, "reservas_con_herramientas": 0, "pct_adopcion": 0.0}, {"mes": "2026-07", "reservas_total": 9485, "reservas_con_herramientas": 0, "pct_adopcion": 0.0}], "evolucion": {"2026-04": {"ce": {"agencias_activas": 1, "agencias_nuevas": 0, "q2": 0, "q3": 0}, "es": {"adopcion": 0, "cancel_rate": 0.0, "timeout_rate": 0.0, "herramientas": 0, "reservas": 0}}, "2026-05": {"ce": {"agencias_activas": 1, "agencias_nuevas": 0, "q2": 0, "q3": 0}, "es": {"adopcion": 0, "cancel_rate": 0.0, "timeout_rate": 0.0, "herramientas": 0, "reservas": 0}}, "2026-06": {"ce": {"agencias_activas": 1, "agencias_nuevas": 0, "q2": 0, "q3": 0}, "es": {"adopcion": 0, "cancel_rate": 0.0, "timeout_rate": 0.0, "herramientas": 0, "reservas": 0}}, "2026-07": {"ce": {"agencias_activas": 1, "agencias_nuevas": 0, "q2": 0, "q3": 0}, "es": {"adopcion": 0, "cancel_rate": 0.0, "timeout_rate": 0.0, "herramientas": 0, "reservas": 0}}}, "meta": {"meses": ["2026-04", "2026-05", "2026-06", "2026-07", "2026-08", "2026-09"], "generado": "2026-07-31 10:12", "fuente": "Datalake Trino"}};
var activeTab='mensual',activeMes='all',activeSq='all',charts={};
function fmt(n){return n==null?'—':Number(n).toLocaleString('es-AR')}
function pct(n){return n==null?'—':Number(n).toFixed(1)+'%'}
function mesLabel(m){return new Date(m+'-15T12:00:00').toLocaleDateString('es-AR',{month:'short',year:'numeric'}).replace('.','')}
function chip(v,cls){return `<span class="chip ${cls||''}">${v}</span>`}
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={}}
function setTab(t,btn){activeTab=t;document.querySelectorAll('.tabpill').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('sq-filter').style.display=t==='progreso'||t==='monitor'?'flex':'none';document.getElementById('mes-filter').style.display=t==='semanal'||t==='progreso'?'flex':'none';render()}
function setPulsoMes(m,btn){activeMes=m;document.querySelectorAll('.mespill').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function setSq(s,btn){activeSq=s;document.querySelectorAll('.sqpill').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function card(title,body){return `<div class="card"><div class="card-hdr">${title}</div>${body}</div>`}
function renderMensual(){
  const rows=DATA.meses.map(m=>{const a=DATA.adopcion.find(x=>x.mes===m)||{},t=DATA.kr21.find(x=>x.mes_deadline===m+'-01')||{};return `<tr><td class="td-kr">${mesLabel(m)}</td><td>${fmt(a.reservas_total)}</td><td>${fmt(a.reservas_con_herramientas)}</td><td>${pct(a.pct_adopcion)}</td><td>${fmt(t.reservas_timeout_client)}</td><td>${pct(t.pct_timeout_client)}</td></tr>`}).join('');
  return `<div class="sec-title">Resumen mensual · abril — septiembre 2026</div>${card('Uso de herramientas y cancelaciones',`<table><thead><tr><th class="th-kr">Mes</th><th>Reservas totales</th><th>Con herramientas</th><th>% adopción</th><th>Timeout client</th><th>% timeout</th></tr></thead><tbody>${rows}</tbody></table>`)}`;
}
function renderSemanal(){
 const arr=DATA.meses.filter(m=>activeMes==='all'||m===activeMes); let data=arr.map(m=>DATA.evolucion[m]||{});
 const ce=data.map(x=>(x.ce||{}).agencias_activas||0),es=data.map(x=>(x.es||{}).adopcion||0),labels=arr.map(mesLabel); let c='';
 if(!arr.length)return '<div class="sec-title">Evolución semanal</div><p>No hay datos para este mes.</p>';
 c+=card('Squad C&amp;E · Agencias activas',`<div style="padding:16px;height:280px"><canvas id="chart-ce"></canvas></div>`);
 c+=card('Squad E&amp;S · Adopción herramientas',`<div style="padding:16px;height:280px"><canvas id="chart-es"></canvas></div>`);
 setTimeout(()=>{destroyCharts();const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}};charts.ce=new Chart(document.getElementById('chart-ce'),{type:'line',data:{labels,datasets:[{label:'Agencias activas',data:ce,borderColor:'#7C3AED',backgroundColor:'#7C3AED22',fill:true,tension:.3}]},options:opts});charts.es=new Chart(document.getElementById('chart-es'),{type:'line',data:{labels,datasets:[{label:'Adopción %',data:es,borderColor:'#5457D9',backgroundColor:'#5457D922',fill:true,tension:.3}]},options:opts})},0);
 return `<div class="sec-title">Evolución semanal · ${activeMes==='all'?'todos los meses':mesLabel(activeMes)}</div>${c}`;
}
function renderProgreso(){
 const ms=activeMes==='all'?DATA.meses:[activeMes];const rows=ms.map(m=>{const x=DATA.evolucion[m]||{},ce=x.ce||{},es=x.es||{};if(activeSq==='ce')return `<tr><td class="td-kr">${mesLabel(m)}</td><td>${fmt(ce.agencias_activas)}</td><td>${fmt(ce.agencias_nuevas)}</td><td>${fmt(ce.q2)}</td><td>${fmt(ce.q3)}</td></tr>`;if(activeSq==='es')return `<tr><td class="td-kr">${mesLabel(m)}</td><td>${fmt(es.adopcion)}</td><td>${pct(es.cancel_rate)}</td><td>${pct(es.timeout_rate)}</td><td>${fmt(es.herramientas)}</td><td>${fmt(es.reservas)}</td></tr>`;return `<tr><td class="td-kr">${mesLabel(m)}</td><td>${fmt(ce.agencias_activas)}</td><td>${fmt(ce.agencias_nuevas)}</td><td>${fmt(es.adopcion)}</td><td>${pct(es.cancel_rate)}</td><td>${pct(es.timeout_rate)}</td></tr>`}).join('');let head=activeSq==='ce'?'<th class="th-kr">Mes</th><th>Agencias activas</th><th>Nuevas</th><th>Q2</th><th>Q3</th>':activeSq==='es'?'<th class="th-kr">Mes</th><th>Adopción %</th><th>Cancelación %</th><th>Timeout %</th><th>Herramientas</th><th>Reservas</th>':'<th class="th-kr">Mes</th><th>Agencias activas</th><th>Nuevas</th><th>Adopción %</th><th>Cancelación %</th><th>Timeout %</th>';return `<div class="sec-title">Progreso por squad · ${activeSq==='all'?'todos':activeSq==='ce'?'C&amp;E':'E&amp;S'}</div>${card('Indicadores de avance',`<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`)}`;
}
function renderMonitor(){
 const rows=DATA.kr21.slice(0,6).map(x=>`<tr><td class="td-kr">${mesLabel(x.mes_deadline.slice(0,7))}</td><td>${fmt(x.total_reservas)}</td><td>${fmt(x.reservas_timeout_client)}</td><td>${pct(x.pct_timeout_client)}</td><td>${chip(x.pct_timeout_client>1?'Revisar':'OK',x.pct_timeout_client>1?'bad':'ok')}</td></tr>`).join('');return `<div class="sec-title">Monitor de calidad de datos</div>${card('KR21 · Cancelaciones por timeout client',`<table><thead><tr><th class="th-kr">Mes</th><th>Reservas</th><th>Timeout client</th><th>% timeout</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table>`)}`;
}
function render(){destroyCharts();let html=activeTab==='mensual'?renderMensual():activeTab==='semanal'?renderSemanal():activeTab==='progreso'?renderProgreso():renderMonitor();document.getElementById('root').innerHTML=html}
function toggleTheme(){document.body.classList.toggle('dark');document.getElementById('theme-btn').textContent=document.body.classList.contains('dark')?'☀️':'🌙'}
render();
</script>
</body>
</html>
