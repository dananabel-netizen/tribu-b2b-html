table{width:100%;border-collapse:collapse;font-size:13px}

.chip{display:inline-block;padding:4px 10px;border-radius:5px;font-size:12px;font-weight:700;min-width:44px;text-align:center}
.ok{background:#d4f4dd;color:#16a34a}.warn{background:#fff7cd;color:#b45309}.bad{background:#ffd8d3;color:#cf222e}.na{background:#f0f0f0;color:#999;font-size:11px;font-weight:400}

function fmt(n){return n==null?'—':Number(n).toLocaleString('es-AR')}

function monthName(d){var m=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return d?m[Number(d.slice(5,7))-1]+' '+d.slice(0,4):'—'}

function table(headers,rows){return'<table><thead><tr>'+headers.map(function(h){return'<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>'}
