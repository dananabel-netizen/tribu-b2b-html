name: Build Dashboard HTML

on:
  push:
    paths:
      - "data.json"
    branches:
      - tablero-live

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate HTML
        run: python build_html.py data.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add okrs_dashboard.html
          git diff --staged --quiet || git commit -m "Auto-refresh dashboard"
          git push
